<title>Inkuno Quiet Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  --scrim:rgba(0,0,0,.12);--shadow-seg:0 1px 2px rgba(0,0,0,.12);--shadow-knob:0 1px 2px rgba(0,0,0,.25);--tl1:#ff5f57;--tl2:#febc2e;--tl3:#28c840;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;

  --scrim:rgba(0,0,0,.45);--shadow-seg:0 1px 2px rgba(0,0,0,.4);--shadow-knob:0 1px 2px rgba(0,0,0,.5);--tl1:#ff5f57;--tl2:#febc2e;--tl3:#28c840;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);margin:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--sans);color:var(--ink)}
button{font:inherit;color:inherit}
::selection{background:var(--sel)}
.app{--s:1;--measure:720px;container-type:inline-size;height:100%;min-height:520px;display:flex;position:relative;overflow:hidden;border-radius:12px;background:var(--ground);color:var(--ink);box-shadow:var(--shadow-win);font-size:13px;line-height:20px}

/* Sidebar */
.side{width:240px;flex:none;display:flex;flex-direction:column;padding:12px 10px 10px;gap:2px;min-height:0;background:var(--ground)}
.app.noside .side{display:none}
.top{display:flex;align-items:center;gap:2px;height:30px;padding:0 2px 0 6px;margin-bottom:6px}
.lights{display:flex;gap:8px;margin-right:auto}
.lights i{width:12px;height:12px;border-radius:50%;background:var(--tl1);display:block}
.lights i:nth-child(2){background:var(--tl2)}.lights i:nth-child(3){background:var(--tl3)}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:0;background:none;color:var(--icon);cursor:pointer;flex:none}
.ib:hover{background:var(--hover)} .ib:active{background:var(--pressed)} .ib.on{background:var(--selected)}
.ib:focus-visible,.row:focus-visible,.seg button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ib svg{width:18px;height:18px}
.row{height:30px;display:flex;align-items:center;gap:9px;padding:0 8px;border-radius:8px;color:var(--side-ink);cursor:default;border:0;background:none;width:100%;text-align:left;font-size:13px;white-space:nowrap;overflow:hidden}
.row svg{width:18px;height:18px;flex:none;color:var(--icon);opacity:.85}
.row span{overflow:hidden;text-overflow:ellipsis}
.row kbd{margin-left:auto;font:11px var(--sans);color:var(--faint)}
.row:hover{background:var(--hover)} .row.sel{background:var(--selected);color:var(--ink)}
.row.sub{padding-left:28px}
.row .chev{width:12px;height:12px;margin-left:-2px;transition:transform .15s}
.row.closed .chev{transform:rotate(-90deg)}
.sect{display:flex;align-items:center;height:30px;padding:0 4px 0 8px;margin-top:12px;font-size:12px;font-weight:600;color:var(--soft)}
.sect .ib{width:24px;height:24px;margin-left:auto;opacity:0}
.sect:hover .ib,.sect .ib:focus-visible{opacity:1}
.tree{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:1px}
.foot{display:flex;flex-direction:column;gap:1px;padding-top:6px}

/* Sheet */
.sheet{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--sheet);box-shadow:var(--shadow-note);position:relative}
.app.noside .sheet{box-shadow:none}
.head{height:46px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 16px}
.head .lights{margin-right:10px;display:none}
.app.noside .head .lights{display:flex}
.head .opener{display:none}
.app.noside .head .opener{display:grid}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--faint)}
.tabs{display:flex;gap:4px;min-width:0;overflow:hidden}
.tab{height:28px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-radius:8px;border:0;background:none;color:var(--soft);font-size:13px;cursor:default;max-width:180px}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--selected);color:var(--ink)}
.tab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;opacity:0}
.tab:hover .x,.tab.on .x{opacity:.7}
.tab .x:hover{background:var(--hover);opacity:1}
.tab .x svg{width:12px;height:12px}
.spacer{flex:1}
.saved{font-size:12px;color:var(--faint);margin-right:6px;white-space:nowrap}

.body{flex:1;display:flex;min-height:0;position:relative}
.scroll{flex:1;overflow:auto;min-width:0}
.doc{max-width:calc(var(--measure) + 96px);margin:0 auto;padding:22px 48px 160px;font-size:calc(15px*var(--s));line-height:calc(22px*var(--s));color:var(--ink);font-feature-settings:"cv11","ss01"}
.app.nomotion *{transition:none!important;animation:none!important}

/* Blocks */
.b{position:relative;padding-top:calc(9px*var(--s));cursor:text;border-radius:4px}
.b:first-child{padding-top:0}
.mk{display:none;color:var(--faint);font-weight:400}
.reveal .live .mk{display:inline}
.reveal .live{background:linear-gradient(90deg,transparent,transparent)}
.caret{display:none}
.h{font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.h1{font-size:calc(28px*var(--s));line-height:1.3;font-weight:700}
.h2{font-size:calc(21px*var(--s));line-height:1.3;font-weight:700}
.h3{font-size:calc(18px*var(--s));line-height:1.33}
.h4{font-size:calc(16px*var(--s));line-height:1.4}
.h5,.h6{font-size:calc(15px*var(--s))} .h6{color:var(--soft)}
.b.k-h{padding-top:calc(22px*var(--s))} .b.k-h.n1{padding-top:calc(6px*var(--s))}
.b.k-h.n3,.b.k-h.n4{padding-top:calc(16px*var(--s))}
.b:first-child.k-h{padding-top:0}
p{margin:0}
strong{font-weight:600} del{color:var(--soft)}
a.ln{color:var(--link);text-decoration:none;cursor:pointer}
a.ln:hover{text-decoration:underline;text-underline-offset:3px}
code.ic{font:calc(13px*var(--s))/1 var(--mono);background:var(--chip);border:1px solid var(--chip-line);border-radius:4px;padding:1px 4px}
.reveal .live code.ic{background:none;border-color:transparent;padding:0}
.li{display:flex;align-items:flex-start;padding-left:calc(var(--d)*24px)}
.lead{width:24px;flex:none;height:calc(22px*var(--s));display:flex;align-items:center;justify-content:flex-start;padding-left:4px;color:var(--ink)}
.lead .dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.lead .dot.d1{background:none;box-shadow:inset 0 0 0 1px currentColor}
.lead .dot.d2{border-radius:1px;width:5px;height:5px}
.lead .num{font-variant-numeric:tabular-nums;color:var(--ink)}
.li .tx{flex:1;min-width:0}
.reveal .live .lead .dot,.reveal .live .lead .num,.reveal .live .lead .box{display:none}
.reveal .live .lead{width:auto;padding-left:0;padding-right:4px}
.box{width:17px;height:17px;border-radius:5px;border:1px solid var(--box);background:var(--sheet);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--sheet)}
.box:hover{border-color:var(--accent)}
.box svg{width:13px;height:13px;opacity:0}
.box.on{background:var(--accent);border-color:var(--accent)} .box.on svg{opacity:1}
.k-task .lead{padding-left:0}
.done{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--faint)}
.q{border-left:3px solid var(--quote);padding-left:14px;color:var(--ink)}
.reveal .live .q{border-left-color:transparent;padding-left:0}
.alert{border-radius:8px;padding:10px 14px;background:color-mix(in srgb,var(--tint) 7%,var(--sheet));border:1px solid color-mix(in srgb,var(--tint) 22%,var(--sheet))}
.alert .al{display:flex;align-items:center;gap:7px;color:var(--tint);font-weight:600;font-size:calc(14px*var(--s))}
.alert .al svg{width:16px;height:16px}
.reveal .live .alert .al svg,.reveal .live .alert .al .lbl{display:none}
.a-NOTE{--tint:var(--n)}.a-TIP{--tint:var(--tip)}.a-IMPORTANT{--tint:var(--imp)}.a-WARNING{--tint:var(--warn)}.a-CAUTION{--tint:var(--cau)}
.code{border:1px solid var(--code-line);background:var(--code-bg);border-radius:8px;overflow:hidden;font:calc(13px*var(--s))/calc(20px*var(--s)) var(--mono);position:relative}
.code .ch{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0 12px;height:26px;font:11px/1 var(--sans);color:var(--faint);letter-spacing:.02em}
.code .copy{opacity:0;width:24px;height:24px}
.code:hover .copy,.copy:focus-visible{opacity:1}
.code .cb{display:grid;grid-template-columns:auto minmax(0,1fr)}
.nums{padding:4px 10px 10px 12px;text-align:right;color:var(--gutter-num);background:var(--gutter);border-right:1px solid var(--code-line);user-select:none;font-variant-numeric:tabular-nums}
.app.nonums .nums{display:none}
.app.nonums .code .cb{grid-template-columns:minmax(0,1fr)}
.src{padding:4px 14px 10px;white-space:pre;overflow-x:auto;color:var(--ink)}
.fence{display:none;padding:0 14px;color:var(--faint)}
.reveal .live .fence{display:block}
.reveal .live .ch{display:none}
.t-com{color:var(--s-com);font-style:italic}.t-kw{color:var(--s-kw)}.t-str{color:var(--s-str)}.t-num{color:var(--s-num)}.t-type{color:var(--s-type)}.t-fn{color:var(--s-fn)}
.tblw{overflow-x:auto;border:1px solid var(--tline);border-radius:8px}
table{border-collapse:collapse;font-size:calc(14px*var(--s));line-height:calc(20px*var(--s));min-width:100%}
th,td{padding:9px 12px;border-right:1px solid var(--tline);border-bottom:1px solid var(--tline);text-align:left;white-space:nowrap}
th:last-child,td:last-child{border-right:0} tr:last-child td{border-bottom:0}
th{background:var(--th);font-weight:600}
.r{text-align:right}.c{text-align:center}
.hr{height:22px;display:flex;align-items:center}
.hr i{display:block;height:2px;width:100%;background-image:radial-gradient(circle,var(--dots) .8px,transparent 1.1px);background-size:6px 2px}
.reveal .live .hr i{display:none}
.math{text-align:center;font:italic calc(18px*var(--s))/1.6 "Cambria","Georgia",serif;padding:6px 0}
.reveal .live .math{text-align:left;font:calc(13px*var(--s))/calc(20px*var(--s)) var(--mono);font-style:normal}
.img{border:1px solid var(--line);border-radius:8px;height:120px;display:grid;place-items:center;color:var(--faint);font-size:13px;background:var(--chip)}
.ph{color:var(--faint);padding-top:calc(9px*var(--s));cursor:text}
.ph kbd{font:12px var(--mono);background:var(--chip);border:1px solid var(--chip-line);border-radius:4px;padding:0 4px;color:var(--soft)}
.viewing{display:flex;align-items:center;gap:10px;margin:0 auto 14px;max-width:calc(var(--measure));padding:8px 8px 8px 14px;border-radius:10px;background:var(--chip);font-size:13px;color:var(--soft)}

    if(/^\$\$/.test(l)){const body=[];i++;while(i<L.length&&!/^\$\$/.test(L[i]))body.push(L[i++]);i++;out.push({k:"math",body,at});continue}
    if(/^\|/.test(l)){const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);out.push({k:"table",rows,at});continue}
    if((m=l.match(/^> \[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$/))){const body=[];i++;while(i<L.length&&/^>/.test(L[i]))body.push(L[i++].replace(/^> ?/,""));out.push({k:"alert",type:m[1],body,at});continue}

    if((m=l.match(/^(\s*)(\d+)\. (.*)/))){out.push({k:"ol",d:m[1].length>>1,n:m[2],t:m[3],at});i++;continue}

function applyLayout(){
  app.classList.toggle("noside",!S.side&&app.getBoundingClientRect().width>720);
  app.classList.toggle("sideover",S.sideover);
  app.classList.toggle("rhide",S.rhide);
  app.classList.toggle("bandhide",S.bandhide);
  app.classList.toggle("focus",S.focusMode);
  app.classList.toggle("nomotion",!S.motion);

function noteHTML(t){
  const blocks=parse(NOTES[t.id].md);
  return `<div class="doc${S.reveal?" reveal":""}" data-note="${t.id}">${blocks.map(b=>block(b,t)).join("")}<div class="ph" data-act="slash">Type <kbd>/</kbd> to add a block</div></div>`;
}
function diffLines(a,b){
  const n=a.length,m=b.length,L=[];for(let i=0;i<=n;i++)L.push(new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ops.push({o:"eq",l:b[j],i,j});i++;j++}else if(L[i+1][j]>=L[i][j+1]){ops.push({o:"del",l:a[i],i});i++}else{ops.push({o:"add",l:b[j],j});j++}}
  while(i<n){ops.push({o:"del",l:a[i],i});i++}
  while(j<m){ops.push({o:"add",l:b[j],j});j++}
  return ops;
}
function compareHTML(t){
  PUI=false;
  const now=NOTES[t.id].md.split("\n").map(l=>l.replace(COMG,"")), old=t.ver.md.split("\n").map(l=>l.replace(COMG,""));
  const NB=parse(now.join("\n")), starts=new Map(NB.map(b=>[b.at,b])), NO={live:-1};
  let body="";
  diffLines(old,now).forEach(o=>{
    if(o.o==="del"){body+=`<div class="wdel">${parse(o.l).map(b=>{b.at=-1;return block(b,NO)}).join("")}</div>`;return}
    const cls=o.o==="add"?"wadd":"cl";
    if(starts.has(o.j)) body+=`<div class="${cls}">${block(starts.get(o.j),NO)}</div>`;
    else if(!now[o.j].trim()) body+=`<div class="${cls}" style="height:12px"></div>`;
  });
  PUI=true;
  return `<div class="cmpbar"><span class="cmptx">Comparing <b>${esc(t.ver.m)}</b> with now</span><span class="spacer"></span><button class="btn" data-act="restore">Restore</button><button class="btn" data-act="cmpclose">Close</button></div><div class="doc">${body}</div>`;
}
function paneHTML(p,i){
  const t=p.act; let body="",pill="";
  if(!t) body=emptyHTML();
  else if(t.k==="set") body=settingsHTML();
  else if(t.k==="cmp") body=compareHTML(t);
  else{
    PUI=true; body=noteHTML(t);
    const n=pendingLines(NOTES[t.id].md).length;
    if(n) pill=`<div class="pill" role="status"><b>${n} change${n>1?"s":""} pending</b><span class="sd">·</span><button class="btn" data-act="acceptall" data-id="${t.id}">Accept all</button><button class="btn" data-act="rejectall" data-id="${t.id}">Reject all</button></div>`;
  }
  return `<div class="pane${i===S.focus?" foc":""}" data-pane="${i}"><div class="pscroll" data-ps="${i}">${body}</div>${pill}</div>`;
}

function viewHTML(t,nid){
  const v=S.rview;

  if(v==="outline"){
    const hs=parse(md).filter(b=>b.k==="h");
    return `<div class="rh">Outline</div>`+(hs.length?hs.map(b=>`<button class="ol" data-go="${b.at}" style="padding-left:${8+(b.n-1)*12}px">${esc(clean(b.t))}</button>`).join(""):`<div class="ptext">No headings yet.</div>`);
  }
  if(v==="comments"){
    const cs=commentsOf(md);
    let h=`<div class="rh">Comments<span style="color:var(--faint);font-weight:500">${cs.length}</span></div>`;
    if(S.draft&&S.draft.id===nid) h+=`<div class="cc"><div class="qp">${esc(S.draft.q)}</div><input class="field" id="cdraft" placeholder="Add a comment, then press Enter"><div class="ca"><button class="btn primary" data-act="csave">Comment</button><button class="btn" data-act="ccancel">Cancel</button></div></div>`;
    h+=cs.map(c=>{const reps=S.replies[nid+":"+c.at]||[];return `<div class="cc${S.fcard===c.at?" foc":""}" data-cc="${c.at}"><div class="ch"><b>${esc(c.who)}</b><span>${esc(c.time||"Today")}</span></div><div class="qp">${esc(c.passage)}</div><div class="ct">${esc(c.text)}</div>${reps.map(r=>`<div class="rp">${esc(r)}</div>`).join("")}${S.reply===c.at?`<input class="field" data-replyf="${c.at}" placeholder="Reply, then press Enter">`:""}<div class="ca"><button class="btn" data-act="resolve" data-at="${c.at}">Resolve</button><button class="btn" data-act="reply" data-at="${c.at}">Reply</button></div></div>`}).join("");
    return h||(S.draft?h:`<div class="ptext">No comments on this note. Select text and choose Comment.</div>`);
  }
  if(v==="versions"){
    const vs=NOTES[nid].vers||[];
    let h=`<div class="rh">Versions</div><div class="vnew">`+(S.vfield?`<input class="field" id="vname" placeholder="Name this version, then press Enter"><div class="row2"><button class="btn primary" data-act="vsave">Save</button><button class="btn" data-act="vcancel">Cancel</button></div>`:`<button class="btn" data-act="savever" style="align-self:flex-start">Save version</button>`)+`</div>`;
    return h+(vs.map((x,k)=>`<button class="vrow" data-ver="${k}"><b>${esc(x.m)}</b><span>${esc(x.t)}</span></button>`).join("")||`<div class="ptext">No saved versions yet.</div>`);
  }
  return `<div class="rh">Assistant</div><div class="ask"><button class="btn" data-act="review"${S.review?" disabled":""} style="height:30px;text-align:left;padding:0 10px">${S.review?"Reviewing this note…":"Review this note"}</button><button class="btn" data-act="tighten" style="height:30px;text-align:left;padding:0 10px">Tighten the wording</button><input class="field" id="askf" placeholder="Ask about this note, then press Enter"></div><div class="ptext">Suggestions appear in the note as pending changes you accept or reject.</div>`;
}

/* ---------- Feedback and menus ---------- */
function toast(msg,undo){
  document.querySelector(".toast")?.remove();
  const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
  t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button>Undo</button>`:""}`;
  if(undo)t.querySelector("button").onclick=()=>{undo();t.remove()};
  app.append(t);clearTimeout(toast.t);toast.t=setTimeout(()=>t.remove(),undo?5000:2600);
}
function closeMenus(){document.querySelectorAll(".pop:not(.pal),.fbar").forEach(e=>e.remove())}
function copy(text,msg){
  const done=()=>toast(msg);
  try{navigator.clipboard.writeText(text).then(done,()=>toast("Copy is blocked here; select the text instead"))}catch(_){toast("Copy is blocked here; select the text instead")}
}
function menu(x,y,items){
  closeMenus();const p=document.createElement("div");p.className="pop";p.setAttribute("role","menu");
  p.innerHTML=items.map((it,k)=>it==="-"?`<div class="msep"></div>`:`<button class="mi${it.danger?" danger":""}" role="menuitem" data-k="${k}">${it.icon?ic(it.icon):""}<span>${it.t}</span>${it.kbd?`<kbd>${it.kbd}</kbd>`:""}</button>`).join("");
  app.append(p);const r=app.getBoundingClientRect();
  p.style.left=Math.max(8,Math.min(x-r.left,r.width-p.offsetWidth-8))+"px";p.style.top=Math.max(8,Math.min(y-r.top,r.height-p.offsetHeight-8))+"px";
  p.onclick=e=>{const b=e.target.closest(".mi");if(!b)return;const it=items[b.dataset.k];closeMenus();it.run&&it.run()};
}
function placeNear(p,el){
  if(!el)return;const r=app.getBoundingClientRect(),pr=el.getBoundingClientRect();
  let top=pr.bottom-r.top+4;if(top+p.offsetHeight>r.height-8)top=pr.top-r.top-p.offsetHeight-4;
  p.style.left=Math.max(8,Math.min(pr.left-r.left,r.width-p.offsetWidth-8))+"px";p.style.top=Math.max(8,top)+"px";
}

/* ---------- Tabs, panes, notes ---------- */
function keepTabs(id){S.panes.forEach(p=>p.tabs.forEach(t=>{if(t.k==="note"&&t.id===id)t.preview=false}))}
function openNote(id,{pv=false,pane=S.focus}={}){
  const p=S.panes[pane];let t=p.tabs.find(x=>x.k==="note"&&x.id===id);
  if(t){if(!pv)t.preview=false}
  else{t=mkTab(id,pv);const pi=pv?p.tabs.findIndex(x=>x.preview):-1;if(pi>=0)p.tabs[pi]=t;else p.tabs.push(t)}
  p.act=t;S.focus=pane;renderAll();
}
function openSettings(page){
  if(page)S.page=page;
  const p=S.panes[S.focus];let t=p.tabs.find(x=>x.k==="set");
  if(!t){t={k:"set",preview:false,scroll:0};p.tabs.push(t)}
  p.act=t;renderAll();
}
function openCompare(v){
  const p=S.panes[S.focus];let t=p.tabs.find(x=>x.k==="cmp"&&x.ver===v);
  if(!t){t={k:"cmp",id:v.id,ver:v,preview:false,scroll:0};p.tabs.push(t)}
  p.act=t;renderAll();
}
function closeTab(pi,ti){
  const p=S.panes[pi],t=p.tabs[ti];if(!t)return;
  p.tabs.splice(ti,1);
  if(p.act===t)p.act=p.tabs[Math.min(ti,p.tabs.length-1)]||null;
  renderAll();
}
function closeActiveTab(){const p=S.panes[S.focus];if(p.act)closeTab(S.focus,p.tabs.indexOf(p.act))}
function cycleTab(dir){
  const p=S.panes[S.focus],n=p.tabs.length;if(n<2)return;
  const i=p.tabs.indexOf(p.act);p.act=p.tabs[(i+dir+n)%n];renderAll();
}
function focusPane(i){
  if(i===S.focus||!S.panes[i])return;
  S.focus=i;
  document.querySelectorAll(".pane").forEach((el,k)=>el.classList.toggle("foc",k===i));
  document.querySelectorAll(".ptabs").forEach((el,k)=>el.classList.toggle("dim",k!==i));
  renderSide();renderRight();
}
function split(){
  if(S.panes.length>1)return closePane(S.focus);
  const a=curTab(),base=(a&&a.id)||"week",t=mkTab(base,false);
  S.panes.push({tabs:[t],act:t});S.focus=1;renderAll();
}
function closePane(i){
  if(S.panes.length<2){toast("Only one pane is open");return}
  S.panes.splice(i,1);S.focus=0;renderAll();
}
function setLive(pi,at){
  const p=S.panes[pi],t=p&&p.act;if(!t||t.k!=="note")return;
  t.live=at;
  const pane=document.querySelector(`[data-pane="${pi}"]`);if(!pane)return;
  pane.querySelectorAll(".b.live").forEach(x=>x.classList.remove("live"));
  const el=at==null?null:pane.querySelector(`.b[data-i="${at}"]`);
  if(el){el.classList.add("live");if(el.classList.contains("k-math"))renderPanes()}
}
function trash(id){
  const list=VAULT.includes(id)?VAULT:SCRATCH,i=list.indexOf(id);if(i<0)return;
  list.splice(i,1);
  S.panes.forEach(p=>{p.tabs=p.tabs.filter(t=>!(t.k==="note"&&t.id===id));if(!p.tabs.includes(p.act))p.act=p.tabs[0]||null});
  renderAll();toast(`Moved “${NOTES[id].title}” to Trash`,()=>{list.splice(i,0,id);renderAll()});
}
function newNote(title="Untitled"){
  const k="n"+Date.now();NOTES[k]={title,folder:"",md:"# "+title+"\n",vers:[]};VAULT.push(k);
  openNote(k);setLive(S.focus,0);toast("New note in ~/Documents/Notes");
}
function newScratch(){
  const k="s"+Date.now();NOTES[k]={title:"Untitled scratch",folder:"Scratch",md:"# Untitled scratch\n",vers:[]};SCRATCH.push(k);
  openNote(k);setLive(S.focus,0);toast("New scratch note in ~/Documents/Scratch");
}
function duplicate(id){
  const k="n"+Date.now();NOTES[k]={...NOTES[id],title:NOTES[id].title+" copy",folder:"",vers:[]};VAULT.push(k);renderAll();toast("Duplicated");
}
function toggleSide(){
  if(app.getBoundingClientRect().width<=720)S.sideover=!S.sideover;else S.side=!S.side;
  renderAll();
}
function toggleBand(){S.bandhide=!S.bandhide;$("#band").classList.remove("peek");renderAll()}
function toggleFocus(){S.focusMode=!S.focusMode;renderAll()}
function panelView(v,versionField){
  S.rview=v;S.rhide=false;if(versionField)S.vfield=true;
  renderAll();if(versionField)document.getElementById("vname")?.focus();
}
function zoom(d){S.size=d===0?15:Math.max(12,Math.min(24,S.size+d));renderAll();toast(`Text size ${S.size}`)}
function relPath(id){
  const cur=NOTES[curId()]?.folder||"",tf=NOTES[id].folder||"",name=encodeURI(NOTES[id].title)+".md";
  if(tf===cur)return name;if(!cur)return encodeURI(tf)+"/"+name;if(!tf)return "../"+name;return "../"+encodeURI(tf)+"/"+name;
}
function addParagraph(text,msg){
  const id=curId();if(!id)return;
  NOTES[id].md=NOTES[id].md.replace(/\n*$/,"")+"\n\n"+text;keepTabs(id);slash=null;closeMenus();
  const bl=parse(NOTES[id].md);renderAll();
  const sc=document.querySelector(`[data-ps="${S.focus}"]`);if(sc)sc.scrollTop=sc.scrollHeight;
  setLive(S.focus,bl.length?bl[bl.length-1].at:null);toast(msg);
}

/* ---------- Comments ---------- */
function startComment(sel){
  const id=curId();if(!id)return;
  const L=NOTES[id].md.split("\n");

function review(){
  const id=curId();

  S.review=true;renderRight();
  setTimeout(()=>{
    const L=NOTES[id].md.split("\n");
    const pi=L.findIndex(l=>/^[A-Za-z]/.test(l)&&!COM.test(l));
    const qi=L.findIndex(l=>/^> .*accent/.test(l));
    if(pi>=0)L[pi]+=" {++ Review the wording before Friday.++}";
    if(qi>=0)L[qi]=L[qi].replace("one accent","{--one accent--}{++one accent, used sparingly++}");
    NOTES[id].md=L.join("\n");S.review=false;S.rview="assist";
    renderAll();const n=pendingLines(NOTES[id].md).length;

}

  const b=document.createElement("div");b.className="fbar";b.setAttribute("role","toolbar");b.setAttribute("aria-label","Format");
  b.innerHTML=B.map((x,j)=>!x?`<span class="sep"></span>`:x[0]==="comment"
    ?`<button data-fb="${j}" title="${x[1]}" aria-label="Comment" style="display:flex;align-items:center;gap:4px;padding:0 8px 0 6px">${ic("comment")}<span style="font-size:12px;font-weight:500">Comment</span></button>`
    :`<button data-fb="${j}" title="${x[1]}${x[2]?"  "+x[2]:""}" aria-label="${x[1]}">${ICON[x[0]]?ic(x[0]):`<span style="padding:0 4px;font-weight:500">${x[0]}</span>`}</button>`).join("");
  document.body.append(b);
  b.style.left=Math.max(8,Math.min(innerWidth-b.offsetWidth-8,r.left+r.width/2-b.offsetWidth/2))+"px";
  b.style.top=Math.max(8,r.top-b.offsetHeight-8)+"px";
  b.onmousedown=e=>e.preventDefault();
  b.onclick=e=>{
    const k=e.target.closest("[data-fb]");if(!k)return;const j=+k.dataset.fb,x=B[j];
    if(x[0]==="comment"){const s=getSelection().toString()||sel.toString();b.remove();startComment(s);return}
    toast(x[1]);b.remove();
  };
}

/* ---------- Actions ---------- */
function act(v,el){
  switch(v){
    case"side":toggleSide();break;
    case"rtog":S.rhide=!S.rhide;renderAll();break;
    case"pal":openPal();break;
    case"new":newNote();break;
    case"settings":openSettings();break;
    case"today":openNote("today",{pv:false});break;
    case"slash":openSlash();break;
    case"dlog":openDlog();break;
    case"whattry":toggleGuide();break;
    case"guide":document.querySelector(".guide")?.remove();break;
    case"review":review();break;
    case"tighten":toast("Tightening proposes changes you accept or reject");break;
    case"savever":S.vfield=true;renderRight();document.getElementById("vname")?.focus();break;
    case"vcancel":S.vfield=false;renderRight();break;
    case"vsave":saveVersion(document.getElementById("vname")?.value);break;
    case"restore":restoreVersion();break;
    case"cmpclose":closeActiveTab();break;
    case"csave":saveComment();break;
    case"ccancel":S.draft=null;renderRight();break;
    case"resolve":{const id=curId(),at=+el.dataset.at;NOTES[id].md=resolveComment(NOTES[id].md,at);keepTabs(id);if(S.fcard===at)S.fcard=null;renderAll();toast("Comment resolved");break}
    case"reply":S.reply=S.reply===+el.dataset.at?null:+el.dataset.at;renderRight();document.querySelector("[data-replyf]")?.focus();break;
    case"acceptall":resolveAll(el.dataset.id,true);break;
    case"rejectall":resolveAll(el.dataset.id,false);break;
    case"folder":toast("Opens a folder picker");break;
    case"trashinfo":toast("Trash keeps notes in .trash inside your notes folder");break;
    case"themes":openPal(">Theme");break;
    case"new-scratch":newScratch();break;
  }
}
const docId=el=>el.closest(".doc")?.dataset.note||"";

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  if(!t.closest(".pop")&&!t.closest(".fbar"))closeMenus();
  const a=t.closest("[data-act]");if(a){act(a.dataset.act,a);return}
  const vw=t.closest("[data-view]");if(vw){S.rview=vw.dataset.view;renderRight();return}
  const cl=t.closest("[data-close]");if(cl){const[pi,ti]=cl.dataset.close.split(":").map(Number);closeTab(pi,ti);return}
  const tb=t.closest("[data-tp]");if(tb){const pi=+tb.dataset.tp,ti=+tb.dataset.ti,p=S.panes[pi],tab=p.tabs[ti];S.focus=pi;if(e.detail>=2&&tab.k==="note")tab.preview=false;p.act=tab;renderAll();return}
  const o=t.closest("[data-open]");if(o){openNote(o.dataset.open,{pv:!(e.metaKey||e.ctrlKey||e.detail>=2||o.hasAttribute("data-perm"))});return}
  const f=t.closest("[data-fold]");if(f){const k=f.dataset.fold;S.closed[k]=!S.closed[k];renderSide();return}
  const pg=t.closest("[data-page]");if(pg){S.page=pg.dataset.page;renderPanes();return}
  const st=t.closest("[data-set]");if(st){const k=st.dataset.set,v=st.dataset.v;if(k==="mode")S.mode=v.toLowerCase();if(k==="size")S.size=+v;if(k==="width")S.width=v;renderAll();return}
  const sw=t.closest("[data-toggle]");if(sw){const k=sw.dataset.toggle;S[k]=!S[k];renderAll();return}
  const kc=t.closest("[data-key]");if(kc){S.listen=+kc.dataset.key;renderPanes();return}
  const pa=t.closest("[data-pacc]");if(pa){resolvePending(docId(pa),+pa.dataset.pacc,true);return}
  const pj=t.closest("[data-prej]");if(pj){resolvePending(docId(pj),+pj.dataset.prej,false);return}
  const cm=t.closest(".cm,.cdot");if(cm){S.rhide=false;S.rview="comments";S.fcard=+cm.dataset.cid;renderAll();document.querySelector(`[data-cc="${S.fcard}"]`)?.scrollIntoView({block:"nearest"});return}
  const cc=t.closest("[data-cc]");if(cc&&!t.closest("button,input")){focusCard(+cc.dataset.cc);return}
  const rb=t.closest("[data-replyf]");if(rb)return;
  const vr=t.closest("[data-ver]");if(vr){openCompare(NOTES[curId()].vers[+vr.dataset.ver]);return}
  const go=t.closest("[data-go]");if(go){document.querySelector(`[data-ps="${S.focus}"] .b[data-i="${go.dataset.go}"]`)?.scrollIntoView({behavior:S.motion?"smooth":"auto",block:"start"});return}
  const bx=t.closest(".box");if(bx){const id=docId(bx);if(!id)return;const L=NOTES[id].md.split("\n"),at=+bx.dataset.at;L[at]=L[at].replace(/\[( |x|X)\]/,m=>m==="[ ]"?"[x]":"[ ]");NOTES[id].md=L.join("\n");keepTabs(id);renderAll();return}
  const cp=t.closest("[data-copy]");if(cp){const blk=parse(NOTES[docId(cp)].md).find(b=>b.at===+cp.dataset.copy);if(blk)copy(blk.body.join("\n"),"Copied the code");return}
  const ln=t.closest("a.ln");if(ln&&!(S.reveal&&t.closest(".b.live"))){e.preventDefault();const h=ln.dataset.href;const id=Object.keys(NOTES).find(k=>k===h||NOTES[k].title.toLowerCase()===h.toLowerCase());if(id){openNote(id,{pv:false});return}toast("Opens "+h+" in your browser");return}
  const bl=t.closest(".b"),pane=t.closest(".pane");
  if(bl&&pane&&!getSelection().toString()){const pi=+pane.dataset.pane;if(pi!==S.focus)focusPane(pi);setLive(pi,+bl.dataset.i);return}
  if(!bl&&pane&&!getSelection().toString()&&!t.closest(".ph")&&!t.closest(".pill"))setLive(+pane.dataset.pane,null);
});
document.addEventListener("contextmenu",e=>{
  const r=e.target.closest("[data-ctx]");if(!r)return;e.preventDefault();
  const id=r.dataset.ctx;
  menu(e.clientX,e.clientY,[
    {t:"Open",icon:"note",run:()=>openNote(id,{pv:false})},
    {t:"Open in new tab",icon:"open",kbd:MOD+"click",run:()=>openNote(id,{pv:false})},"-",
    {t:"Rename",icon:"pen",run:()=>toast("Rename edits the file name in place")},
    {t:"Duplicate",icon:"dup",run:()=>duplicate(id)},
    {t:"Move to…",icon:"move",run:()=>toast("Pick a folder from a short list")},
    {t:"Copy path",icon:"copy",run:()=>copy(tabPath({k:"note",id}),"Copied the file path")},"-",
    {t:"Move to Trash",icon:"trash",danger:true,run:()=>trash(id)}]);
});
document.addEventListener("mousedown",e=>{
  const pane=e.target.closest(".pane");if(pane)focusPane(+pane.dataset.pane);
  if(e.button===1&&e.target.closest(".tab"))e.preventDefault();
});
document.addEventListener("auxclick",e=>{
  const tb=e.target.closest(".tab");if(tb&&e.button===1)closeTab(+tb.dataset.tp,+tb.dataset.ti);
});
document.addEventListener("mouseup",()=>setTimeout(showBar,0));
document.addEventListener("keyup",e=>{if(e.shiftKey)showBar()});
document.addEventListener("selectionchange",()=>{if(getSelection().isCollapsed)document.querySelector(".fbar")?.remove()});
document.addEventListener("scroll",e=>{
  const el=e.target;if(!el.classList||!el.classList.contains("pscroll"))return;
  const i=+el.dataset.ps,t=S.panes[i]&&S.panes[i].act;if(t)t.scroll=el.scrollTop;
  if(i===S.focus)syncOutline();
  document.querySelector(".fbar")?.remove();
},true);
function syncOutline(){
  const sc=document.querySelector(`[data-ps="${S.focus}"]`);if(!sc)return;
  const hs=[...sc.querySelectorAll(".b.k-h")];if(!hs.length)return;
  const top=sc.getBoundingClientRect().top+24;let cur=hs[0];hs.forEach(h=>{if(h.getBoundingClientRect().top<=top)cur=h});
  document.querySelectorAll(".ol").forEach(o=>o.classList.toggle("on",o.dataset.go===cur.dataset.i));
}
/* Keys that are being rebound take the next key press */
document.addEventListener("keydown",e=>{
  if(S.listen===null)return;
  e.preventDefault();e.stopPropagation();
  if(e.key==="Escape"){S.listen=null;renderPanes();return}
  if(["Shift","Control","Alt","Meta"].includes(e.key))return;
  const combo=(e.metaKey||e.ctrlKey?MOD:"")+(e.altKey?"⌥":"")+(e.shiftKey?"⇧":"")+(e.key.length===1?e.key.toUpperCase():e.key);
  S.keys[S.listen][1]=combo;S.listen=null;renderPanes();
},true);
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey,inField=/INPUT|TEXTAREA/.test(document.activeElement?.tagName||"");
  if(e.target.id==="cdraft"&&e.key==="Enter"){e.preventDefault();saveComment();return}
  if(e.target.id==="vname"&&e.key==="Enter"){e.preventDefault();saveVersion(e.target.value);return}
  if(e.target.id==="askf"&&e.key==="Enter"){e.preventDefault();toast("The assistant answers here once it is connected");return}
  if(e.target.dataset&&e.target.dataset.replyf!==undefined&&e.key==="Enter"){e.preventDefault();const at=+e.target.dataset.replyf,key=curId()+":"+at,v=e.target.value.trim();if(v){(S.replies[key]=S.replies[key]||[]).push(v)}S.reply=null;renderRight();return}
  if(pal&&$("#palq")){
    if(e.key==="ArrowDown"){pal.act=Math.min(pal.act+1,pal.items.length-1);drawPal();e.preventDefault();return}
    if(e.key==="ArrowUp"){pal.act=Math.max(pal.act-1,0);drawPal();e.preventDefault();return}
    if(e.key==="Enter"){runPal(pal.act,mod);e.preventDefault();return}
    if(e.key==="Escape"){closePal();return}
  }
  if(slash&&document.querySelector(".slash")){
    if(e.key==="Escape"){slash=null;closeMenus();return}
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){slash.act=Math.min(slash.act+1,slash.items.length-1);drawSlash();e.preventDefault();return}
    if(e.key==="ArrowUp"||e.key==="ArrowLeft"){slash.act=Math.max(slash.act-1,0);drawSlash();e.preventDefault();return}
    if(e.key==="Enter"){const it=slash.items[slash.act];if(it)it.pick?openPicker(it.pick):insert(it);e.preventDefault();return}
    if(e.key==="Backspace"){if(!slash.q){slash=null;closeMenus()}else{slash.q=slash.q.slice(0,-1);drawSlash()}e.preventDefault();return}
    if(e.key.length===1&&!mod){slash.q+=e.key;drawSlash();e.preventDefault();return}
  }
  if(mod&&e.altKey&&/^Digit[1-4]$/.test(e.code)){e.preventDefault();panelView(["outline","comments","versions","assist"][+e.code[5]-1]);return}
  if(mod&&e.altKey&&e.code==="KeyS"){e.preventDefault();panelView("versions",true);return}
  if(mod&&!e.altKey&&/^Digit[12]$/.test(e.code)){if(S.panes.length>1){e.preventDefault();focusPane(+e.code[5]-1)}return}
  if(mod&&(e.key==="k"||e.key==="p")){e.preventDefault();openPal();return}
  if(mod&&e.key===","){e.preventDefault();openSettings();return}
  if(mod&&!e.shiftKey&&e.key==="b"){e.preventDefault();toggleSide();return}
  if(mod&&e.key==="\\"){e.preventDefault();split();return}
  if(mod&&e.shiftKey&&e.code==="KeyS"){e.preventDefault();toggleBand();return}
  if(mod&&e.shiftKey&&(e.key==="o"||e.key==="O")){e.preventDefault();panelView("outline");return}
  if(mod&&e.shiftKey&&(e.key==="n"||e.key==="N")){e.preventDefault();newNote();return}
  if(mod&&!e.shiftKey&&e.key==="n"){e.preventDefault();newScratch();return}
  if(mod&&e.key==="w"){e.preventDefault();closeActiveTab();return}
  if(mod&&(e.key==="="||e.key==="+")){e.preventDefault();zoom(1);return}
  if(mod&&e.key==="-"){e.preventDefault();zoom(-1);return}
  if(mod&&e.key==="0"){e.preventDefault();zoom(0);return}
  if(mod&&e.key==="Tab"){e.preventDefault();cycleTab(e.shiftKey?-1:1);return}
  if(e.key==="F9"){e.preventDefault();toggleFocus();return}
  if(e.key==="F1"){e.preventDefault();openSettings("Shortcuts");return}
  if(e.key==="Escape"){
    if(document.getElementById("dlog")){closeDlog();return}
    if(S.focusMode){S.focusMode=false;renderAll();return}
    closeMenus();const t=curTab();if(t&&t.k==="note"&&t.live!=null)setLive(S.focus,null);return;
  }
  if(!inField&&e.key==="/"&&curTab()&&curTab().k==="note"){e.preventDefault();openSlash();return}
  if(!inField&&curTab()&&curTab().k==="note"&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&curTab().live!=null){
    e.preventDefault();
    const pane=document.querySelector(`[data-pane="${S.focus}"]`),bs=[...pane.querySelectorAll(".b")];
    const cur=bs.findIndex(x=>+x.dataset.i===curTab().live);
    const nx=bs[Math.max(0,Math.min(bs.length-1,cur+(e.key==="ArrowDown"?1:-1)))];
    if(nx){setLive(S.focus,+nx.dataset.i);nx.scrollIntoView({block:"nearest"})}
  }
});

/* ---------- Title band reveal and window size ---------- */
$("#strip").addEventListener("mouseenter",()=>$("#band").classList.add("peek"));
$("#strip").addEventListener("mouseleave",()=>setTimeout(()=>{if(!$("#band").matches(":hover"))$("#band").classList.remove("peek")},160));
$("#band").addEventListener("mouseleave",()=>$("#band").classList.remove("peek"));
let wide=app.getBoundingClientRect().width>=1000;
S.rhide=!wide;
renderAll();
addEventListener("resize",()=>{
  document.querySelector(".fbar")?.remove();
  const w=app.getBoundingClientRect().width>=1000;
  if(w!==wide){wide=w;S.rhide=!w;renderAll()}
});
</script>
