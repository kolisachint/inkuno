<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkuno iPhone v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Colour tokens are the desktop v3 set (Quiet theme). iPhone-only tokens follow them. */
:root{
  --page:#e4e5e7;
  --ground:#eff0f1; --sheet:#ffffff; --ink:#1f2225; --side-ink:rgba(31,34,37,.85); --soft:#5d6064; --faint:#9c9fa0; --icon:#3f4143;
  --line:rgba(0,0,0,.08); --hover:rgba(0,0,0,.045); --selected:rgba(0,0,0,.072); --pressed:rgba(0,0,0,.09);
  --accent:#3a85f7; --sel:rgba(58,133,247,.24); --link:#105592;
  --code-bg:#fbfbfb; --code-line:#eaebeb; --gutter:#f8f8f8; --gutter-num:#b9babc;
  --th:#f8f8f8; --tline:rgba(0,0,0,.09); --chip:#f6f6f7; --chip-line:#e2e3e3;
  --pop:#fafafa; --box:rgba(0,0,0,.22); --dots:rgba(31,34,37,.45); --quote:#c9cacb; --seg:#ebeced; --seg-on:#ffffff; --sw-off:rgba(31,34,37,.22); --field:#8a8d91;
  --s-com:#8a8d93; --s-kw:#b2565c; --s-str:#89713a; --s-num:#9759b3; --s-type:#3878b1; --s-fn:#5f7e43;
  --n:#2f6fd6; --tip:#2f8a57; --imp:#7c4dd6; --warn:#a8650a; --cau:#c93a3a;
  --toast:#1f2225; --toast-ink:#ffffff; --toast-act:#8ab4f8;
  --add:rgba(46,160,90,.15);--add-ink:#1f7a43;--del:rgba(201,58,58,.11);--del-ink:#b3322f;--cmw:rgba(232,176,30,.26);--cmd:#c98a00;--hl:rgba(58,133,247,.16);
  --scrim:rgba(0,0,0,.12);--shadow-seg:0 1px 2px rgba(0,0,0,.12);--shadow-knob:0 1px 2px rgba(0,0,0,.25);--tl1:#ff5f57;--tl2:#febc2e;--tl3:#28c840;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --shadow-note:-1px 0 1px rgba(0,0,0,.035),-2px 0 10px rgba(0,0,0,.045);
  --shadow-menu:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.10);
  --shadow-win:0 1px 2px rgba(0,0,0,.06),0 18px 48px rgba(0,0,0,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;
  --ground:#141517; --sheet:#1c1c1e; --ink:#e6e6e6; --side-ink:rgba(230,230,230,.82); --soft:#a3a5a8; --faint:#6f7174; --icon:#c9cacb;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.055); --selected:rgba(255,255,255,.085); --pressed:rgba(255,255,255,.11);
  --accent:#4b8ff8; --sel:rgba(75,143,248,.32); --link:#8ab4f8;
  --code-bg:#212123; --code-line:#2e2f31; --gutter:#1f1f21; --gutter-num:#5b5d60;
  --th:#232325; --tline:rgba(255,255,255,.09); --chip:#262628; --chip-line:#353638;
  --pop:#2a2a2c; --box:rgba(255,255,255,.3); --dots:rgba(230,230,230,.4); --quote:#4a4c4f; --seg:#202022; --seg-on:#3a3a3c; --sw-off:rgba(230,230,230,.28); --field:#6f7174;
  --s-com:#8d9096; --s-kw:#e06c75; --s-str:#d8b25c; --s-num:#c58af9; --s-type:#6cb6ff; --s-fn:#98c379;
  --n:#6ea6ff; --tip:#58c48a; --imp:#a98bff; --warn:#e0a23c; --cau:#ff7b72;
  --toast:#e6e6e6; --toast-ink:#1c1c1e; --toast-act:#105592;
  --add:rgba(88,196,138,.16);--add-ink:#7fe0a6;--del:rgba(255,123,114,.15);--del-ink:#ff9d96;--cmw:rgba(232,176,30,.22);--cmd:#f0c040;--hl:rgba(75,143,248,.24);
  --scrim:rgba(0,0,0,.45);--shadow-seg:0 1px 2px rgba(0,0,0,.4);--shadow-knob:0 1px 2px rgba(0,0,0,.5);--tl1:#ff5f57;--tl2:#febc2e;--tl3:#28c840;
  --shadow-note:-1px 0 1px rgba(0,0,0,.3),-2px 0 12px rgba(0,0,0,.35);
  --shadow-menu:0 1px 3px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  --shadow-win:0 1px 2px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0b0b0c;
  --ground:#141517; --sheet:#1c1c1e; --ink:#e6e6e6; --side-ink:rgba(230,230,230,.82); --soft:#a3a5a8; --faint:#6f7174; --icon:#c9cacb;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.055); --selected:rgba(255,255,255,.085); --pressed:rgba(255,255,255,.11);
  --accent:#4b8ff8; --sel:rgba(75,143,248,.32); --link:#8ab4f8;
  --code-bg:#212123; --code-line:#2e2f31; --gutter:#1f1f21; --gutter-num:#5b5d60;
  --th:#232325; --tline:rgba(255,255,255,.09); --chip:#262628; --chip-line:#353638;
  --pop:#2a2a2c; --box:rgba(255,255,255,.3); --dots:rgba(230,230,230,.4); --quote:#4a4c4f; --seg:#202022; --seg-on:#3a3a3c; --sw-off:rgba(230,230,230,.28); --field:#6f7174;
  --s-com:#8d9096; --s-kw:#e06c75; --s-str:#d8b25c; --s-num:#c58af9; --s-type:#6cb6ff; --s-fn:#98c379;
  --n:#6ea6ff; --tip:#58c48a; --imp:#a98bff; --warn:#e0a23c; --cau:#ff7b72;
  --toast:#e6e6e6; --toast-ink:#1c1c1e; --toast-act:#105592;
  --add:rgba(88,196,138,.16);--add-ink:#7fe0a6;--del:rgba(255,123,114,.15);--del-ink:#ff9d96;--cmw:rgba(232,176,30,.22);--cmd:#f0c040;--hl:rgba(75,143,248,.24);
  --scrim:rgba(0,0,0,.45);--shadow-seg:0 1px 2px rgba(0,0,0,.4);--shadow-knob:0 1px 2px rgba(0,0,0,.5);--tl1:#ff5f57;--tl2:#febc2e;--tl3:#28c840;
  --shadow-note:-1px 0 1px rgba(0,0,0,.3),-2px 0 12px rgba(0,0,0,.35);
  --shadow-menu:0 1px 3px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  --shadow-win:0 1px 2px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark}
/* iPhone-only tokens */
:root{--ctx:rgba(255,255,255,.82);--ctx-ink:#1f2225;--sep:rgba(0,0,0,.1);--tint:#3a85f7;--kbd-bg:#d1d3d9;--kbd-acc:#d6d8de;--key:#ffffff;--key-fn:#aeb1b9;--mscrim:rgba(0,0,0,.08);--red:#c93a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ctx:rgba(44,44,46,.84);--ctx-ink:#e6e6e6;--sep:rgba(255,255,255,.12);--kbd-bg:#2b2b2e;--kbd-acc:#353538;--key:#5a5a5e;--key-fn:#3a3a3d;--mscrim:rgba(0,0,0,.2);--red:#ff7b72}}
:root[data-theme="dark"]{--ctx:rgba(44,44,46,.84);--ctx-ink:#e6e6e6;--sep:rgba(255,255,255,.12);--kbd-bg:#2b2b2e;--kbd-acc:#353538;--key:#5a5a5e;--key-fn:#3a3a3d;--mscrim:rgba(0,0,0,.2);--red:#ff7b72}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
svg{flex:none}
.faint{color:var(--faint)}
.small{font-size:13px}
.soft{color:var(--soft)}

/* Stage: phone on the page ground; design log beside it or below it */
.stage{display:flex;flex-wrap:wrap;gap:40px 48px;justify-content:center;align-items:flex-start;padding:32px 16px 56px;max-width:1280px;margin:0 auto}
.wrap{flex:none;width:calc(390px * var(--k,1));height:calc(844px * var(--k,1))}
.phone{position:relative;width:390px;height:844px;transform:scale(var(--k,1));transform-origin:0 0;border-radius:48px;background:var(--ground);overflow:hidden;outline:10px solid #1d1d1f;box-shadow:var(--shadow-win);font-family:var(--sans);font-size:var(--fs,16px);isolation:isolate;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.phone[data-width=narrow]{--gut:30px}
.phone[data-width=normal]{--gut:22px}
.phone[data-width=wide]{--gut:14px}
.sbar{position:absolute;top:0;left:0;right:0;height:54px;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 46px;font-weight:600;font-size:16px;pointer-events:none;color:var(--ink)}
.sicons{display:flex;gap:6px;align-items:center}
.sicons svg{width:18px;height:12px}
.sicons svg:last-child{width:26px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:55;pointer-events:none}
.hind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.9;z-index:60;pointer-events:none}

/* Pages and push/pop */
#pages{position:absolute;inset:0;z-index:1;transition:bottom .25s ease}
.phone.kb #pages{bottom:262px}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--ground);padding-bottom:48px;transition:transform .32s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.enter,.page.leave{transform:translateX(100%)}
.page.leave{transition-duration:.28s}

/* Navigation bar: 44 px row under the status bar, large titles below */
.nav{position:sticky;top:0;z-index:5;height:98px;padding:54px 6px 0;display:flex;align-items:center;justify-content:space-between;background:var(--ground)}
.navr{display:flex;align-items:center}
.navbtn{min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--accent);font-size:17px;padding:0 8px}
.navbtn svg{width:22px;height:22px}
.navbtn span{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntitle{position:absolute;left:50%;transform:translateX(-50%);top:54px;height:44px;display:flex;align-items:center;max-width:46%;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.focusnav{justify-content:flex-end}
.large{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 16px 14px}
.sec{font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;padding:20px 32px 6px}
.foot{color:var(--soft);font-size:13px;padding:6px 32px 16px}
.empty{color:var(--faint);text-align:center;padding:24px;font-size:15px}
.pullhint{color:var(--faint);font-size:13px;text-align:center;padding:14px 24px}

/* Home cards */
.card{display:block;width:calc(100% - 32px);text-align:left;background:var(--sheet);border-radius:16px;padding:14px 16px;margin:0 16px 12px;box-shadow:var(--shadow-menu);min-height:44px}
.line{display:flex;align-items:center;gap:10px;color:var(--soft);font-size:16px}
.line svg{width:20px;height:20px}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.homegrid .card,.rc{width:auto}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:112px;margin:0}
.tile>svg{width:22px;height:22px;color:var(--accent);margin-bottom:auto}
.tile b{font-size:16px;margin-top:8px}
.tile small{color:var(--soft);font-size:13px}
.recall{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.recall::-webkit-scrollbar{display:none}
.rc{flex:0 0 150px;margin:0 0 4px;min-height:84px}
.rc b{display:block;font-size:15px}
.rc small{color:var(--soft);font-size:13px}

/* Rows and lists */
.rows{background:var(--sheet);border-radius:12px;margin:0 16px 8px;overflow:hidden}
.row{min-height:44px;width:100%;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--tline);text-align:left;background:none;flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row>svg{width:20px;height:20px;color:var(--icon)}
.row>svg:last-child{width:14px;height:14px;color:var(--faint)}
.row.col{flex-direction:column;align-items:stretch;gap:8px}
.row.sel{background:var(--hover)}
.rt{flex:1;min-width:0;font-size:16px}
.rt small{display:block;color:var(--soft);font-size:13px}
.age{color:var(--faint);font-size:14px}
.row .cta{width:auto}
.chip{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--chip-line);background:var(--chip);color:var(--soft);margin-left:6px;white-space:nowrap;vertical-align:middle;line-height:1.5}
.chip.dfr{color:var(--warn);border-color:var(--warn)}
.chip.simp{color:var(--imp);border-color:var(--imp)}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;width:100%;gap:2px}
.seg button{flex:1;text-align:center;min-height:30px;border-radius:7px;font-size:14px;color:var(--ink);padding:0 4px;white-space:nowrap}
.seg button.on{background:var(--seg-on);box-shadow:var(--shadow-seg);font-weight:600}
.seg.wide{margin:4px 0 12px}
.seg.wide button{font-size:13px;min-height:32px;padding:0 2px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--sw-off);position:relative;flex:none;margin-left:auto;transition:background .2s}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:var(--shadow-knob);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(20px)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;width:100%;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;padding:0 16px}
.cta.sm{min-height:36px;width:auto;font-size:15px;padding:0 14px;border-radius:10px}
.cta svg{width:18px;height:18px}

/* Onboarding */
.ob{padding:120px 28px 0;display:flex;flex-direction:column;gap:14px}
.ob h1{font-size:30px;line-height:1.15;margin:12px 0 0;letter-spacing:-.02em}
.ob p{color:var(--soft);font-size:16px;margin:0}
.obmark{width:68px;height:68px;border-radius:18px;background:var(--accent);display:grid;place-items:center;color:#fff}
.obmark svg{width:36px;height:36px}
.ob .cta{margin-top:20px}

/* Note body: live styling */
.doc{padding:6px var(--gut) 40px;font-size:var(--fs,16px);line-height:1.6;color:var(--ink)}
.b{position:relative;margin:0;padding:3px 0}
.b.live{background:var(--hl);border-radius:6px;margin:0 -8px;padding:3px 8px}
.h1{font-size:1.9em;font-weight:700;line-height:1.2;margin:.4em 0 .3em;letter-spacing:-.01em}
.h2{font-size:1.45em;font-weight:650;margin:.9em 0 .2em;line-height:1.25}
.h3{font-size:1.15em;font-weight:600;margin:.8em 0 .1em}
.h4,.h5,.h6{font-size:1em;font-weight:600;margin:.7em 0 0}
p.b{margin:.35em 0}
.q{border-left:3px solid var(--quote);padding-left:12px;color:var(--soft);margin:.5em 0}
.li{display:flex;gap:10px;align-items:flex-start;margin:.15em 0}
.lead{flex:none;width:18px;display:inline-flex;justify-content:center;align-items:center;padding-top:.4em;font-variant-numeric:tabular-nums}
.lead .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);margin-top:.2em}
.lead.num{color:var(--soft);justify-content:flex-end;padding-top:0}
.lead.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--box);margin-top:.25em;margin-left:-2px;padding:0}
.lead.box.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lead.box svg{width:13px;height:13px}
.task.done .txt{color:var(--faint);text-decoration:line-through}
.li .txt{flex:1;min-width:0}
hr.b{border:0;border-top:1px solid var(--line);margin:1em 0}
.mk{display:none;color:var(--faint);font-weight:400}
.doc.reveal .b.live .mk{display:inline}
.doc.reveal .b.live .cmsrc{display:inline}
.cmsrc{display:none;color:var(--faint);font-family:var(--mono);font-size:.8em}
code.ic{font:.86em var(--mono);background:var(--code-bg);border:1px solid var(--code-line);border-radius:5px;padding:0 4px}
.doc.reveal .b.live code.ic{background:none;border-color:transparent;padding:0}
a.ln{color:var(--link);text-decoration:underline;text-decoration-color:rgba(16,85,146,.35);text-underline-offset:3px}
.tag{color:var(--imp)}
.dl{color:var(--n);background:var(--hl);border-radius:4px;padding:0 3px}
ins.pw{background:var(--add);color:var(--add-ink);text-decoration:none;border-radius:3px}
del.pwd{background:var(--del);color:var(--del-ink);text-decoration:line-through;border-radius:3px}
.cm{background:var(--cmw);border-bottom:1.5px solid var(--cmd);border-radius:2px;cursor:pointer}
.cdot{position:absolute;right:-15px;top:.7em;width:7px;height:7px;border-radius:50%;background:var(--cmd);cursor:pointer}
.pre,.code{font:calc(var(--fs,16px) * .82)/1.55 var(--mono);background:var(--code-bg);border:1px solid var(--code-line);border-radius:10px;padding:10px 12px;margin:.6em 0;overflow-x:auto;white-space:pre;color:var(--ink);display:block}
.t-com{color:var(--s-com)}.t-str{color:var(--s-str)}.t-num{color:var(--s-num)}.t-kw{color:var(--s-kw)}.t-fn{color:var(--s-fn)}.t-type{color:var(--s-type)}
.alert{margin:.7em 0;border-radius:10px;padding:10px 12px 10px 14px;border-left:3px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent);font-size:.95em}
.alert .al{font-weight:600;color:var(--ac);margin-bottom:2px}
.alert.TIP{--ac:var(--tip)}.alert.NOTE{--ac:var(--n)}.alert.IMPORTANT{--ac:var(--imp)}.alert.WARNING{--ac:var(--warn)}.alert.CAUTION{--ac:var(--cau)}
.tblwrap{overflow-x:auto;margin:.6em 0;border-radius:8px}
.tblwrap table{border-collapse:collapse;font-size:.92em;white-space:nowrap}
.tblwrap th,.tblwrap td{border:1px solid var(--tline);padding:6px 10px;text-align:left;vertical-align:top}
.tblwrap th{background:var(--th);font-weight:600}
.tblwrap td{cursor:pointer}
.media{display:block;width:100%;margin:.7em 0;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;text-align:left}
.mtag{display:flex;align-items:center;font-size:13px;color:var(--soft);margin-bottom:6px}
.mmd{display:block;width:100%;height:auto;color:var(--soft)}
.math{font-size:19px;padding:10px 0 4px;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--ink);flex-wrap:wrap}
.sigma{position:relative;display:inline-block;font-size:26px;margin-right:6px}
.sigma sup,.sigma sub{position:absolute;font-size:11px;left:50%;transform:translateX(-50%)}
.sigma sup{top:-16px}.sigma sub{bottom:-14px;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px}
.frac>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 4px 2px}
.frac>span:last-child{padding-top:2px}
/* v4: figures, formulas, conflict sheet */
.chip.v4{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.media.fig{position:relative;padding:0;border:0;background:none;margin:8px 0}
.media.fig:not(.err){padding-top:36px}
.figmag{position:absolute;top:-6px;right:-8px;width:44px;height:44px;display:grid;place-items:center;color:var(--soft);z-index:2;isolation:isolate;border-radius:50%}
.figmag::before{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:var(--chip);opacity:.9;z-index:-1}
.figmag svg{width:18px;height:18px}
.fchip{position:absolute;top:0;left:0;margin:0;font-size:9px;padding:1px 5px;z-index:2}
.figscroll{overflow-x:auto;scrollbar-width:none;padding:0}
.figscroll::-webkit-scrollbar{display:none}

.showsrc{flex:none;min-height:44px;padding:0 4px;color:var(--accent);font-weight:600;font-size:14px}
.prevlbl{font-size:13px;color:var(--soft);margin:10px 0 2px}
.dmath{width:max-content;margin:0 auto;padding:8px 0 6px;font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:19px;color:var(--ink);font-style:normal}

.imath sup,.dmath sup{top:-.5em}
.imath sub,.dmath sub{top:.3em}
.bigop{position:relative;display:inline-block;font-size:1.35em;line-height:1;vertical-align:-.1em;margin-right:.7em}
.bigop .lim{position:absolute;left:100%;margin-left:.15em;font-size:.6em;line-height:1;white-space:nowrap;font-style:normal}
.bigop .lim.up{bottom:55%}
.bigop .lim.dn{top:55%}
.wdot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.ccard{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.chead{font-size:13px;color:var(--soft);margin-bottom:6px}
.cline{font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;padding:1px 6px;border-radius:4px;margin:2px 0}

.cline.del{background:var(--del);color:var(--del-ink)}

.confacts .pbtns button{flex:1}

/* Pill, keyboard, toast */
#pill{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;z-index:24;pointer-events:none;transition:bottom .25s ease}
#pill:empty{display:none}
.pill{pointer-events:auto;background:var(--toast);color:var(--toast-ink);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:var(--shadow-menu);min-height:40px}
.phone.kb #pill{bottom:272px}
#kbd{position:absolute;left:0;right:0;bottom:0;height:262px;z-index:22;background:var(--kbd-bg);display:none}
.phone.kb #kbd{display:block}
.acc{height:44px;display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--kbd-acc);border-bottom:1px solid var(--line)}
.acc button{min-width:40px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink);font-size:15px;padding:0 4px}
.acc button svg{width:20px;height:20px}
.acc .sp{flex:1}
.keys{padding:8px 3px}
.krow{display:flex;justify-content:center;gap:6px;margin-bottom:9px}
.k{flex:1;height:40px;border-radius:6px;background:var(--key);box-shadow:0 1px 0 rgba(0,0,0,.25);font-size:19px;color:var(--ink);min-width:0}
.k.fn{flex:1.5;background:var(--key-fn);font-size:14px}
.k.sp{flex:5}
#toast{position:absolute;left:14px;right:14px;bottom:96px;z-index:80;background:var(--toast);color:var(--toast-ink);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:var(--shadow-menu);opacity:0;transform:translateY(12px);transition:opacity .2s,transform .2s;pointer-events:none}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast span{flex:1;line-height:1.35}
#toast button{color:var(--toast-act);font-weight:600;min-height:36px;padding:0 10px}
.phone.kb #toast{bottom:318px}

/* Bottom sheet: one sheet for the right panel, pickers and palette */
#sheetLayer{position:absolute;inset:0;z-index:40;pointer-events:none}
#sheetLayer:empty{display:none}
#sheetLayer .scrim{position:absolute;inset:0;background:var(--scrim);pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:10px 10px 0 0;box-shadow:var(--shadow-menu);pointer-events:auto;display:flex;flex-direction:column;transition:height .25s cubic-bezier(.2,.8,.2,1)}
.sheet.new{animation:sheetup .3s cubic-bezier(.2,.8,.2,1)}
.sheet.half{height:430px}
.sheet.full{height:780px}
.sheetscroll{overflow-y:auto;flex:1;padding:0 0 32px;scrollbar-width:none}

.grab{width:36px;height:5px;border-radius:3px;background:var(--box)}
.sheetbody{padding:4px 16px 0}
.sheetbody h3{font-size:17px;margin:6px 0 10px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 10px}
.phead b{font-size:17px}
.pacts2{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.pacts2 button{min-height:36px;padding:0 14px;border-radius:9px;background:var(--seg);font-size:15px}
.pacts2 .cta{min-height:36px;width:auto;font-size:15px;padding:0 14px;border-radius:9px;background:var(--accent);color:#fff}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{position:relative;border-radius:12px;overflow:hidden}
.pbg{position:absolute;inset:0;display:flex;align-items:center;padding:0 16px;font-weight:600;font-size:15px;gap:6px}
.pbg.acc{background:var(--add);color:var(--add-ink);justify-content:flex-start}
.pbg.rej{background:var(--del);color:var(--del-ink);justify-content:flex-end}
.pbg svg{width:18px;height:18px}
.pfg{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;touch-action:pan-y}
.pline{font:13px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word;margin:2px 0}
.pline.o{color:var(--del-ink);text-decoration:line-through}
.pline.n{color:var(--add-ink)}
.pbtns{display:flex;gap:8px;margin-top:8px}
.pbtns button{min-height:34px;padding:0 12px;border-radius:9px;background:var(--seg);font-size:14px}
.bq{border-left:3px solid var(--quote);padding-left:10px;color:var(--soft);margin:6px 0 12px;font-size:15px}
.field{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--field);background:var(--sheet);padding:10px 12px;font-size:16px;outline:none;margin:6px 0 12px;display:block}
.field:focus{box-shadow:0 0 0 2px var(--accent)}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;align-items:center}
.btns button:not(.cta){min-height:40px;padding:0 14px;border-radius:10px;font-size:15px;color:var(--accent)}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;border-bottom:1px solid var(--tline);min-height:50px}
.fhead b{font-size:17px}
.fhead .blue{color:var(--accent);font-weight:600}
.fcrumb{color:var(--soft);font-size:13px;padding:12px 18px 6px}
.crow{padding:12px 16px;border-bottom:1px solid var(--tline)}
.crow .quote{color:var(--soft);border-left:3px solid var(--cmd);padding-left:8px;font-size:14px}
.cmeta{color:var(--faint);font-size:12px;margin:6px 0 2px}
.cacts{display:flex;gap:8px;margin-top:8px}
.cacts button:not(.cta){min-height:34px;padding:0 12px;border-radius:9px;background:var(--seg);font-size:14px}
.pbody{padding:0 16px}
.pbody>.cta{margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.gi svg{width:22px;height:22px;color:var(--icon)}
.gi .chip{margin:0}
.palbox{padding:0 16px}

.palin input{flex:1;border:0;background:none;outline:none;font-size:17px;min-height:40px;color:var(--ink);min-width:0}

.prow{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px;border-radius:10px;text-align:left;width:100%}
.prow:hover{background:var(--hover)}
.prow>svg{width:18px;height:18px;color:var(--icon)}
.prow .pt{flex:1;min-width:0;font-size:16px}

.prow .age{font-size:13px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}

/* Context menus and the comment popover */
#menuLayer{position:absolute;inset:0;z-index:70}

.ctx{position:absolute;width:250px;background:var(--ctx);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:13px;box-shadow:var(--shadow-menu);overflow:hidden;animation:pop .18s ease}
.ci{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;font-size:16px;color:var(--ctx-ink);text-align:left}

.cpop{position:absolute;left:24px;right:24px;background:var(--ctx);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:13px;padding:14px 14px 12px;box-shadow:var(--shadow-menu);font-size:15px;animation:pop .18s ease}
.cpop .cq{color:var(--soft);border-left:3px solid var(--cmd);padding-left:8px;font-size:14px}
.cpop p{margin:8px 0 0}
.cpop .cacts{margin-top:10px}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}

/* Full-screen viewer */
#fsLayer{position:absolute;inset:0;z-index:48;background:var(--sheet);display:none;flex-direction:column}
#fsLayer.on{display:flex}
.fsbar{position:relative;display:flex;align-items:center;justify-content:space-between;padding:54px 6px 0;min-height:98px;border-bottom:1px solid var(--tline)}

.fsbar>div{display:flex;gap:2px;align-items:center}
.fsbar button{min-width:44px;min-height:44px;color:var(--accent);display:grid;place-items:center}
.fsbar button.blue{font-weight:600;padding:0 8px;font-size:16px;width:auto}
.fsbar svg{width:20px;height:20px}
.fsbody{flex:1;overflow:auto;padding:16px;touch-action:none}
.fscont{transform-origin:50% 0;transition:transform .15s}
.fscont>svg{display:block;margin:0 auto}
.fscont .dmath{font-size:30px;padding-top:24px}
.fshint{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);background:var(--toast);color:var(--toast-ink);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap}

/* Compare screen */
.cmphead{display:flex;align-items:center;gap:8px;padding:0 16px 10px}
.cmphead h2{font-size:22px;margin:0;letter-spacing:-.01em}
.cmp{margin:0 16px 16px;background:var(--sheet);border-radius:12px;padding:8px 0;font:13px/1.6 var(--mono);overflow-x:auto}
.cl{padding:0 12px;white-space:pre-wrap;word-break:break-word;min-height:1.6em}
.cl span{display:inline-block;width:14px;color:var(--faint)}
.cl.add{background:var(--add);color:var(--add-ink)}
.cl.del{background:var(--del);color:var(--del-ink);text-decoration:line-through}
.bottombar{padding:8px 16px 0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* Design log */
.log{flex:1 1 560px;max-width:740px;min-width:0;width:100%}
.logwrap{background:var(--sheet);border-radius:14px;padding:22px 22px 26px;box-shadow:var(--shadow-menu)}

.log p{margin:6px 0}
.log ul{padding-left:18px;margin:6px 0}
.log li{margin:3px 0}
.v1sw{display:flex;gap:10px;align-items:flex-start;background:var(--ground);border-radius:10px;padding:12px;margin:14px 0 4px;cursor:pointer}
.v1sw input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.tw{overflow-x:auto;margin-top:8px;border:1px solid var(--tline);border-radius:10px}
.log table{border-collapse:collapse;font-size:13px;width:100%;min-width:780px}
.log th,.log td{border-bottom:1px solid var(--tline);padding:7px 8px;text-align:left;vertical-align:top}
.log th{background:var(--th);font-size:12px;color:var(--soft);font-weight:600}
.log td.n{color:var(--faint);font-variant-numeric:tabular-nums}
.vk{font-weight:600}
.vk.keep{color:var(--tip)}
.vk.simp{color:var(--imp)}
.vk.defer{color:var(--warn)}
.log .chip{margin-left:4px}
.logfoot{color:var(--soft);font-size:13px;margin-top:10px}

/* A small TeX subset: letters, digits, \frac, \tfrac, \dfrac, \int, \sum, \pi, \,, ^ and _ with groups. Anything else is unreadable. */
const GREEK={pi:"π",alpha:"α",beta:"β",theta:"θ",sigma:"σ",infty:"∞",sum:"∑",int:"∫"};
function texHTML(src){
  const s=String(src).trim(); if(!s) return null;

    const m=/^\\([A-Za-z]+|,)/.exec(s.slice(i)); if(!m) fail(); i+=m[0].length;
    const n=m[1];
    if(n===",") return '<span class="thin"></span>';
    if(n==="frac"||n==="tfrac"||n==="dfrac"){const a=arg(),b=arg();return `<span class="frac"><span>${a}</span><span>${b}</span></span>`}
    if(!GREEK[n]) fail();

  };

    const c=s[i];

    if(c==="+"||c==="-")return `<span class="bin">${c}</span>`;
    return /[A-Za-z]/.test(c)?`<i>${c}</i>`:esc(c);
  };
  const arg=()=>{
    if(s[i]==="{"){i++;const h=run(true);if(s[i]!=="}")fail();i++;return h}
    return single();
  };

    let h="";
    while(i<s.length&&s[i]!=="}"){
      const c=s[i];
      if(c===" "){i++;continue}
      if(c==="^"||c==="_"){i++;const a=arg();if(big){h=h.slice(0,-7)+`<span class="lim ${c==="^"?"up":"dn"}">${a}</span></span>`}else h+=c==="^"?`<sup>${a}</sup>`:`<sub>${a}</sub>`;continue}

/* Sizes each figure to the note column: natural size if it fits, else down to 0.75, else 0.75 with a scroll and a fade. */

  sc.classList.toggle("more",ov&&sc.scrollLeft+sc.clientWidth<sc.scrollWidth-2);

    const nw=sv?+inn.dataset.w:inn.offsetWidth;

/* Keeps the live block above the keyboard, as UIKit scrolls the caret into view. A figure's source goes to the top so its Preview stays visible. */

function sheetBody(s){

function paintSheet(){

  L.innerHTML=`<div class="scrim" data-a="closeSheet"></div><div class="sheet ${S.det}${sheetFresh?" new":""}" id="sheet" role="dialog" aria-modal="true"><div class="grabwrap" id="grab" aria-label="Drag to resize"><div class="grab"></div></div>${sheetBody(s)}</div>`;

function bindGrab(){
  const g=$("#grab"); if(!g)return; let y0=null;
  g.addEventListener("pointerdown",e=>{y0=e.clientY;g.setPointerCapture(e.pointerId)});
  g.addEventListener("pointerup",e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;
    if(dy<-40&&S.det!=="full"){S.det="full";paintSheet()}
    else if(dy>40){if(S.det==="full"){S.det="half";paintSheet()}else closeSheet()}});
}
function bindSwipe(){
  $$(".pfg").forEach(el=>{
    let x0=null,dx=0;const card=el.parentElement;
    el.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;x0=e.clientX;dx=0;el.setPointerCapture(e.pointerId);el.style.transition="none"});
    el.addEventListener("pointermove",e=>{if(x0==null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px)`});
    const end=()=>{if(x0==null)return;const d=dx;x0=null;el.style.transition="";
      if(d>90||d<-90){el.style.transform=`translateX(${d>0?"100%":"-100%"})`;const i=+card.dataset.pi,acc=d>0;setTimeout(()=>applyPend(S.sheet.id,i,acc),180)}
      else el.style.transform="";};
    el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  });
}
function bindPal(){
  const inp=$("#palq"); if(!inp)return;

/* ---------- Actions ---------- */
function trashNote(id){const n=NOTES[id];n.trashed=true;toast(`Moved “${n.title}” to Trash`,()=>{n.trashed=false;paint()});paint()}
function saveVersion(id){NOTES[id].vers.unshift({t:"Today, "+hhmm(),m:"Saved version",md:NOTES[id].md});toast("Version saved");paint()}
function restore(id,v){
  const n=NOTES[id], target=n.vers[v].md;
  n.vers.unshift({t:"Today, "+hhmm(),m:"Before restore",md:n.md});
  n.md=target; S.sheet=null;
  if(cur().k==="compare"){back()}else paint();
  toast("Restored. The previous text is kept as a version.");
}
function applyOne(n,p,acc){
  if(acc) n.md=n.md.split("\n").map(l=>l===p.old?p.text:l).join("\n");
}
function applyPend(id,i,acc){
  const n=NOTES[id], p=n.pend[i]; if(!p)return;
  applyOne(n,p,acc); n.pend.splice(i,1);
  if(!n.pend.length&&S.sheet&&S.sheet.k==="pending")S.sheet=null;
  toast(acc?"Change accepted":"Change rejected"); paint();
}
function resolveAll(id,acc){
  const n=NOTES[id]; n.pend.forEach(p=>applyOne(n,p,acc)); n.pend=[];
  if(S.sheet&&S.sheet.k==="pending")S.sheet=null;
  toast(acc?"All changes accepted":"All changes rejected"); paint();
}
function toggleFocus(){S.focus=!S.focus;paint()}
function openPanel(view){if(cur().k!=="note")return;openSheet({k:"panel",view,id:cur().id},"half")}
function openLink(href){
  let dec=href; try{dec=decodeURIComponent(href)}catch(e){}
  const n=liveNotes().find(x=>x.title+".md"===dec);
  if(n) return openNote(n.id);
  toast(/^https?:/.test(href)?"Opens in Safari (not in this prototype)":"No note called "+href);
}
function openComposer(id,at){openSheet({k:"composer",id,at},"half")}
function openSlash(){if(cur().k==="note")openSheet({k:"slash"},"half")}
function openLinks(){if(cur().k==="note")openSheet({k:"links",id:cur().id},"half")}
function openPal(q=""){openSheet({k:"pal",q},"full")}

/* Command list for the > mode and the palette */
function CMDS(){
  const id=cur().k==="note"?cur().id:null;
  const L=[
    {g:"This note",t:"Save version",run:()=>saveVersion(id),need:id},
    {g:"This note",t:"Show outline",run:()=>openPanel("outline"),need:id},
    {g:"This note",t:"Show comments",run:()=>openPanel("comments"),need:id},
    {g:"This note",t:"Show backlinks",run:()=>openPanel("backlinks"),need:id},
    {g:"Formatting",t:"Bold",run:()=>toast("Notes are read-only in this prototype")},
    {g:"Notes",t:"Today’s note",run:()=>openNote("today")},
    {g:"Notes",t:"New note",run:()=>toast("New notes are not created in this prototype")},
    {g:"Notes",t:"Restore from Trash",run:()=>go({k:"trash"})},
    {g:"Window",t:"Accept all changes",run:()=>resolveAll(id,true),need:id&&NOTES[id].pend.length>0},
    {g:"Window",t:"Reject all changes",run:()=>resolveAll(id,false),need:id&&NOTES[id].pend.length>0},
    {g:"Window",t:"Settings",run:()=>go({k:"settings"})},
    {g:"Window",t:"Focus",run:toggleFocus,need:id&&!S.v1}
  ];
  return L.filter(c=>c.need===undefined||!!c.need);
}
function snippet(md,q){
  const i=md.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(md.slice(0,60));
  const a=Math.max(0,i-28),b=Math.min(md.length,i+q.length+36);
  return (a?"…":"")+esc(md.slice(a,i))+"<mark>"+esc(md.slice(i,i+q.length))+"</mark>"+esc(md.slice(i+q.length,b))+(b<md.length?"…":"");
}
function palRows(q){
  const ql=q.trim().toLowerCase(), live=liveNotes();
  if(ql.startsWith(">")){const c=ql.slice(1).trim();return CMDS().filter(x=>!c||x.t.toLowerCase().includes(c)).map(x=>({g:x.g,t:x.t,sub:"",icon:"palette",run:x.run}))}
  if(!ql) return live.slice(0,6).map(n=>({g:"Recent",t:n.title,sub:esc(n.folder||"Notes"),age:n.age,icon:"note",run:()=>openNote(n.id)}));
  const tm=live.filter(n=>n.title.toLowerCase().includes(ql));
  const cm=live.filter(n=>!tm.includes(n)&&n.md.toLowerCase().includes(ql));
  const R=[];
  tm.forEach(n=>R.push({g:"Names",t:n.title,sub:esc(n.folder||"Notes"),age:n.age,icon:"note",run:()=>openNote(n.id)}));
  cm.forEach(n=>R.push({g:"Content",t:n.title,sub:snippet(n.md,ql),age:n.age,icon:"note",run:()=>openNote(n.id)}));
  if(!live.some(n=>n.title.toLowerCase()===ql)) R.push({g:"",t:`Create «${q.trim()}»`,sub:"",icon:"plus",run:()=>toast("New notes are not created in this prototype")});
  return R;
}
function palListHTML(q){
  S.palRuns=palRows(q);
  let g=null,h="";
  S.palRuns.forEach((r,i)=>{
    if(r.g!==g){g=r.g;if(g)h+=`<div class="pgh">${esc(g)}</div>`}
    h+=`<button class="prow" data-a="palRun" data-i="${i}">${ic(r.icon)}<span class="pt">${esc(r.t)}${r.sub?`<small>${r.sub}</small>`:""}</span>${r.age?`<span class="age">${r.age}</span>`:""}</button>`;
  });
  return h||'<div class="empty">No matches</div>';
}
function panelHTML(s){
  const n=NOTES[s.id], v=s.view;
  const seg=`<div class="seg wide" role="group">${[["outline","Outline"],["comments","Comments"],["versions","Versions"],["backlinks","Backlinks"]].map(([k,l])=>`<button class="${k===v?"on":""}" data-a="pview" data-v="${k}">${l}</button>`).join("")}</div>`;
  let body="";
  if(v==="outline"){
    const hs=n.md.split("\n").map((l,at)=>{const m=/^(#{1,6}) (.*)/.exec(l);return m?{at,lvl:m[1].length,t:m[2]}:null}).filter(Boolean);
    body=hs.length?`<div class="rows">${hs.map(h=>`<button class="row" data-a="goto" data-at="${h.at}" style="padding-left:${14+(h.lvl-1)*16}px"><span class="rt">${esc(h.t)}</span></button>`).join("")}</div>`:`<div class="empty">No headings in this note.</div>`;
  } else if(v==="comments"){
    const cs=commentsOf(n.md);
    body=cs.length?cs.map(c=>`<div class="crow"><div class="quote">${esc(c.passage||"(line)")}</div><div class="cmeta">${esc(c.who)}${c.time?" · "+esc(c.time):""}</div><div>${esc(c.text)}</div><div class="cacts"><button class="cta sm" data-a="resolve" data-id="${n.id}" data-at="${c.at}">Resolve</button><button data-a="reply">Reply</button></div></div>`).join("")
      :`<div class="empty">No comments on this note.</div>`;
    body+=`<p class="soft small" style="margin-top:12px">Comments are added from a block’s long-press menu. ${chip("Simplified")}</p>`;
  } else if(v==="versions"){

  } else {
    const bl=liveNotes().filter(x=>x.id!==n.id&&(x.md.includes(n.title+".md")||x.md.includes(encodeURI(n.title)+".md")));
    body=bl.length?`<div class="rows">${bl.map(x=>`<button class="row" data-a="note" data-id="${x.id}">${ic("note")}<span class="rt">${esc(x.title)}<small>Links to ${esc(n.title)}</small></span>${ic("right")}</button>`).join("")}</div>`:`<div class="empty">No notes link here yet.</div>`;
  }
  return `<h3 style="margin:4px 0 10px">${esc(n.title)}</h3>${seg}${body}`;
}
function pendingHTML(s){

  doRestore:el=>restore(el.dataset.id||S.sheet.id,+(el.dataset.v??S.sheet.v)),
  restore:el=>restore(el.dataset.id,+el.dataset.v),
  addCmt:()=>{const s=S.sheet,n=NOTES[s.id],t=($("#cmtxt").value||"").trim();if(!t)return toast("Write a comment first");n.md=addComment(n.md,s.at,t);S.sheet=null;toast("Comment added");paint()},
  cellDone:()=>{toast("Cell edits are not saved in this prototype")},
  palRun:el=>{const r=S.palRuns[+el.dataset.i];if(!r)return;closeSheet();r.run&&r.run()},
  slashpick:el=>{closeSheet();toast(`Adds ${el.dataset.k.toLowerCase()} after the caret line (not saved)`)},
  pickLink:el=>{const n=NOTES[el.dataset.id];closeSheet();toast(`Writes [${n.title}](${n.title}.md) (not saved)`)},
  acc:el=>{const k=el.dataset.k;
    if(k==="slash")return openSlash();
    if(k==="link")return openLinks();
    if(k==="hide")return setLive(null);
    const msg={hash:"#tags stay plain text, so GitHub shows them too",task:"Adds a task line (not saved in this prototype)",indent:"Indent is not applied: notes are read-only here",outdent:"Outdent is not applied: notes are read-only here",undo:"Undo is not available in this prototype"}[k];
    toast(msg)},
  key:()=>toast("Keys do nothing: notes are read-only in this prototype"),
  tbox:()=>toast("Checkboxes are read-only in this prototype"),
  fscopy:()=>toast("Copied image"),
  fsshare:()=>toast("Share sheet is not part of this prototype"),
  conflict:el=>openSheet({k:"conflict",id:el.dataset.id},"full"),
  confPick:el=>{S.sheet.w=el.dataset.w;paintSheet()},
  confKeep:el=>{const w=el.dataset.w,id=S.sheet.id,c=NOTES[id],t=NOTES[CONF.target],was={md:t.md,pend:t.pend.slice(),vers:t.vers.slice()};
    /* Writes the chosen lines over the Mac block, keeps the replaced text as a version, removes the conflict copy, then opens the note. */
    const L=confResult(w,t.md.split("\n")).map(r=>r[0]);
    t.vers.unshift({t:"Today, "+hhmm(),m:"Before conflict merge",md:t.md});t.md=L.join("\n");t.pend=t.pend.filter(p=>CONF.pairs[p.old]===undefined&&L.includes(p.old));
    delete NOTES[id];S.sheet=null;
    go({k:"note",id:CONF.target});
    toast(w==="both"?"Merged. Lines both sides changed appear twice":w==="iphone"?"Kept the iPhone version":"Kept the Mac version",()=>{Object.assign(t,was);NOTES[id]=c;back()});},
  fsclose:()=>$("#fsLayer").classList.remove("on"),
  noop:()=>{}
};
function applyTheme(){const r=document.documentElement;S.theme==="system"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",S.theme==="quiet"?"light":S.theme)}

/* ---------- Event wiring ---------- */
let lp=null,lpT=null,pl=null;
function longPress(key,p){
  const [type,id,at]=key.split(":");
  if(type==="note"){const n=NOTES[id];
    openMenu(p,[
      {t:"Rename",i:"pen",fn:()=>toast("Rename is not saved in this prototype")},
      {t:"Move…",i:"move",fn:()=>toast("Move is not saved in this prototype")},
      {t:"Duplicate",i:"dup",fn:()=>toast("Duplicate is not saved in this prototype")},
      {t:"Copy link",i:"link",fn:()=>toast(`Copied [${n.title}](${n.title}.md)`)},
      {sep:1},
      {t:"Move to Trash",i:"trash",d:1,fn:()=>trashNote(id)}]);
  } else if(type==="block"){
    const a=+at, b=parse(composed(NOTES[id])).find(x=>x.at===a);
    const items=[{t:"Comment",i:"comment",fn:()=>openComposer(id,a)},{t:"Show Markdown",i:"md",fn:()=>setLive(a)}];
    if(b&&b.k==="table")items.push({t:"Edit as Markdown",i:"table",fn:()=>setLive(a)});
    const fk=b&&!S.v1&&(b.k==="math"||(b.k==="code"&&b.lang==="mermaid"))?(b.k==="math"?"math":"mermaid"):null;
    if(fk&&renderFig(fk,b.body.join("\n")))items.splice(2,0,{t:"Copy image",i:"copy",fn:()=>toast("Copied image")},{t:"View full screen",i:"fs",fn:()=>openFs(fk,b.body.join("\n"))});
    items.push({t:"Copy",i:"copy",fn:()=>toast("Copied")},{t:"Duplicate",i:"dup",fn:()=>toast("Duplicate is not saved in this prototype")},{sep:1},{t:"Delete",i:"trash",d:1,fn:()=>toast("Delete is not saved in this prototype")});
    openMenu(p,items);
  }
}
phone.addEventListener("contextmenu",e=>e.preventDefault());
phone.addEventListener("pointerdown",e=>{
  S.suppress=false; clearTimeout(lpT); lp=null; pl=null;
  const p=pt(e), onPage=!S.sheet&&(cur().k==="home"||cur().k==="note")&&p.y<230&&!e.target.closest("button,input,a");
  if(onPage) pl={x:e.clientX,y:e.clientY};
  const el=e.target.closest("[data-lp]");
  if(el){const key=el.dataset.lp;lp={x:e.clientX,y:e.clientY};lpT=setTimeout(()=>{S.suppress=true;lp=null;longPress(key,p)},500)}
});
phone.addEventListener("pointermove",e=>{
  if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){clearTimeout(lpT);lp=null}
  if(pl&&!S.sheet&&e.clientY-pl.y>60&&Math.abs(e.clientX-pl.x)<40){pl=null;openPal("")}
});
const endPress=()=>{clearTimeout(lpT);lp=null;pl=null};
phone.addEventListener("pointerup",endPress);
phone.addEventListener("pointercancel",endPress);
phone.addEventListener("click",e=>{
  if(S.suppress){S.suppress=false;return}
  const t=e.target;
  const cm=t.closest(".cm,.cdot");
  if(cm&&cur().k==="note"){openCpop(+cm.dataset.cid);return}
  const a=t.closest("a.ln");
  if(a&&!t.closest(".b.live")){e.preventDefault();openLink(a.dataset.href);return}
  if(t.closest(".dl")){openNote("today");return}
  const tg=t.closest(".tag");
  if(tg){openPal(tg.textContent);return}
  const fg=t.closest("figure[data-fs]");
  if(fg){
    if(t.closest(".figmag")){openFs(fg.dataset.fs,decodeURIComponent(fg.dataset.src));return}
    if(!fg.closest(".fgrp")) setLive(+fg.dataset.at);
    return;
  }
  if(t.closest(".fgrp")) return;
  const cell=t.closest("td[data-cell]");
  if(cell){if(!S.v1)openSheet({k:"cell",text:cell.textContent},"half");return}
  const ad=t.closest("[data-a]");
  if(ad){const f=H[ad.dataset.a];if(f)f(ad);return}
  const b=t.closest(".doc .b[data-at]");
  if(b&&cur().k==="note"){const at=+b.dataset.at;setLive(S.live&&S.live.id===cur().id&&S.live.at===at?null:at);return}
  if(S.live&&cur().k==="note"&&!t.closest("#sheetLayer,#menuLayer,#pill,#fsLayer")) setLive(null);
});
phone.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});
const KBDROWS=["qwertyuiop","asdfghjkl","zxcvbnm"];

<div class="keys">${KBDROWS.map((r,i)=>`<div class="krow">${i===2?'<button class="k fn" data-a="key">⇧</button>':""}${[...r].map(c=>`<button class="k" data-a="key">${c}</button>`).join("")}${i===2?'<button class="k fn" data-a="key">⌫</button>':""}</div>`).join("")}<div class="krow"><button class="k fn" data-a="key">123</button><button class="k sp" data-a="key">space</button><button class="k fn" data-a="key">return</button></div></div>`;
