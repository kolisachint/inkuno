<title>Inkuno Quiet Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a desktop window on the page ground. Grey sidebar straight on the window, one white sheet flush right with a faint left shadow; header, note, outline dock inside the sheet. Tokens follow Quiet.md's craft scale. */
:root{
  --page:#e4e5e7;
  --ground:#eff0f1; --sheet:#ffffff; --ink:#1f2225; --side-ink:rgba(31,34,37,.85); --soft:#5d6064; --faint:#9c9fa0; --icon:#3f4143;
  --line:rgba(0,0,0,.08); --hover:rgba(0,0,0,.045); --selected:rgba(0,0,0,.072); --pressed:rgba(0,0,0,.09);
  --accent:#3a85f7; --sel:rgba(58,133,247,.24); --link:#105592;
  --code-bg:#fbfbfb; --code-line:#eaebeb; --gutter:#f8f8f8; --gutter-num:#b9babc;
  --th:#f8f8f8; --tline:rgba(0,0,0,.09); --chip:#f6f6f7; --chip-line:#e2e3e3;
  --pop:#fafafa; --box:rgba(0,0,0,.22); --dots:rgba(31,34,37,.45); --quote:#c9cacb; --seg:#ebeced;
  --s-com:#8a8d93; --s-kw:#b2565c; --s-str:#89713a; --s-num:#9759b3; --s-type:#3878b1; --s-fn:#5f7e43;
  --n:#2f6fd6; --tip:#2f8a57; --imp:#7c4dd6; --warn:#a8650a; --cau:#c93a3a;
  --toast:#1f2225; --toast-ink:#ffffff;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --shadow-note:-1px 0 1px rgba(0,0,0,.035),-2px 0 10px rgba(0,0,0,.045);
  --shadow-menu:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.10);
  --shadow-win:0 1px 2px rgba(0,0,0,.06),0 18px 48px rgba(0,0,0,.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;
  --ground:#141517; --sheet:#1c1c1e; --ink:#e6e6e6; --side-ink:rgba(230,230,230,.82); --soft:#a3a5a8; --faint:#6f7174; --icon:#c9cacb;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.055); --selected:rgba(255,255,255,.085); --pressed:rgba(255,255,255,.11);
  --accent:#4b8ff8; --sel:rgba(75,143,248,.32); --link:#8ab4f8;
  --code-bg:#212123; --code-line:#2e2f31; --gutter:#1f1f21; --gutter-num:#5b5d60;
  --th:#232325; --tline:rgba(255,255,255,.09); --chip:#262628; --chip-line:#353638;
  --pop:#2a2a2c; --box:rgba(255,255,255,.3); --dots:rgba(230,230,230,.4); --quote:#4a4c4f; --seg:#2a2a2c;
  --s-com:#8d9096; --s-kw:#e06c75; --s-str:#d8b25c; --s-num:#c58af9; --s-type:#6cb6ff; --s-fn:#98c379;
  --n:#6ea6ff; --tip:#58c48a; --imp:#a98bff; --warn:#e0a23c; --cau:#ff7b72;
  --toast:#e6e6e6; --toast-ink:#1c1c1e;
  --shadow-note:-1px 0 1px rgba(0,0,0,.3),-2px 0 12px rgba(0,0,0,.35);
  --shadow-menu:0 1px 3px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  --shadow-win:0 1px 2px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0b0b0c;
  --ground:#141517; --sheet:#1c1c1e; --ink:#e6e6e6; --side-ink:rgba(230,230,230,.82); --soft:#a3a5a8; --faint:#6f7174; --icon:#c9cacb;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.055); --selected:rgba(255,255,255,.085); --pressed:rgba(255,255,255,.11);
  --accent:#4b8ff8; --sel:rgba(75,143,248,.32); --link:#8ab4f8;
  --code-bg:#212123; --code-line:#2e2f31; --gutter:#1f1f21; --gutter-num:#5b5d60;
  --th:#232325; --tline:rgba(255,255,255,.09); --chip:#262628; --chip-line:#353638;
  --pop:#2a2a2c; --box:rgba(255,255,255,.3); --dots:rgba(230,230,230,.4); --quote:#4a4c4f; --seg:#2a2a2c;
  --s-com:#8d9096; --s-kw:#e06c75; --s-str:#d8b25c; --s-num:#c58af9; --s-type:#6cb6ff; --s-fn:#98c379;
  --n:#6ea6ff; --tip:#58c48a; --imp:#a98bff; --warn:#e0a23c; --cau:#ff7b72;
  --toast:#e6e6e6; --toast-ink:#1c1c1e;
  --shadow-note:-1px 0 1px rgba(0,0,0,.3),-2px 0 12px rgba(0,0,0,.35);
  --shadow-menu:0 1px 3px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  --shadow-win:0 1px 2px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark}
/* The app's own Appearance setting overrides the viewer theme inside the window. */
.app[data-mode="light"]{
  --ground:#eff0f1; --sheet:#ffffff; --ink:#1f2225; --side-ink:rgba(31,34,37,.85); --soft:#5d6064; --faint:#9c9fa0; --icon:#3f4143;
  --line:rgba(0,0,0,.08); --hover:rgba(0,0,0,.045); --selected:rgba(0,0,0,.072); --pressed:rgba(0,0,0,.09);
  --accent:#3a85f7; --sel:rgba(58,133,247,.24); --link:#105592;
  --code-bg:#fbfbfb; --code-line:#eaebeb; --gutter:#f8f8f8; --gutter-num:#b9babc;
  --th:#f8f8f8; --tline:rgba(0,0,0,.09); --chip:#f6f6f7; --chip-line:#e2e3e3;
  --pop:#fafafa; --box:rgba(0,0,0,.22); --dots:rgba(31,34,37,.45); --quote:#c9cacb; --seg:#ebeced;
  --s-com:#8a8d93; --s-kw:#b2565c; --s-str:#89713a; --s-num:#9759b3; --s-type:#3878b1; --s-fn:#5f7e43;
  --n:#2f6fd6; --tip:#2f8a57; --imp:#7c4dd6; --warn:#a8650a; --cau:#c93a3a;
  --toast:#1f2225; --toast-ink:#ffffff;
  --shadow-note:-1px 0 1px rgba(0,0,0,.035),-2px 0 10px rgba(0,0,0,.045);
  --shadow-menu:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.10);
  color-scheme:light}
.app[data-mode="dark"]{
  --ground:#141517; --sheet:#1c1c1e; --ink:#e6e6e6; --side-ink:rgba(230,230,230,.82); --soft:#a3a5a8; --faint:#6f7174; --icon:#c9cacb;
  --line:rgba(255,255,255,.08); --hover:rgba(255,255,255,.055); --selected:rgba(255,255,255,.085); --pressed:rgba(255,255,255,.11);
  --accent:#4b8ff8; --sel:rgba(75,143,248,.32); --link:#8ab4f8;
  --code-bg:#212123; --code-line:#2e2f31; --gutter:#1f1f21; --gutter-num:#5b5d60;
  --th:#232325; --tline:rgba(255,255,255,.09); --chip:#262628; --chip-line:#353638;
  --pop:#2a2a2c; --box:rgba(255,255,255,.3); --dots:rgba(230,230,230,.4); --quote:#4a4c4f; --seg:#2a2a2c;
  --s-com:#8d9096; --s-kw:#e06c75; --s-str:#d8b25c; --s-num:#c58af9; --s-type:#6cb6ff; --s-fn:#98c379;
  --n:#6ea6ff; --tip:#58c48a; --imp:#a98bff; --warn:#e0a23c; --cau:#ff7b72;
  --toast:#e6e6e6; --toast-ink:#1c1c1e;
  --shadow-note:-1px 0 1px rgba(0,0,0,.3),-2px 0 12px rgba(0,0,0,.35);
  --shadow-menu:0 1px 3px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);margin:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--sans);color:var(--ink)}
button{font:inherit;color:inherit}
::selection{background:var(--sel)}
.app{--s:1;--measure:720px;container-type:inline-size;height:100%;min-height:520px;display:flex;position:relative;overflow:hidden;border-radius:12px;background:var(--ground);color:var(--ink);box-shadow:var(--shadow-win);font-size:13px;line-height:20px}

/* Sidebar */
.side{width:240px;flex:none;display:flex;flex-direction:column;padding:12px 10px 10px;gap:2px;min-height:0;background:var(--ground)}
.app.noside .side{display:none}
.top{display:flex;align-items:center;gap:2px;height:30px;padding:0 2px 0 6px;margin-bottom:6px}
.lights{display:flex;gap:8px;margin-right:auto}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;display:block}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:0;background:none;color:var(--icon);cursor:pointer;flex:none}
.ib:hover{background:var(--hover)} .ib:active{background:var(--pressed)} .ib.on{background:var(--selected)}
.ib:focus-visible,.row:focus-visible,.seg button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ib svg{width:18px;height:18px}
.row{height:30px;display:flex;align-items:center;gap:9px;padding:0 8px;border-radius:8px;color:var(--side-ink);cursor:default;border:0;background:none;width:100%;text-align:left;font-size:13px;white-space:nowrap;overflow:hidden}
.row svg{width:18px;height:18px;flex:none;color:var(--icon);opacity:.85}
.row span{overflow:hidden;text-overflow:ellipsis}
.row kbd{margin-left:auto;font:11px var(--sans);color:var(--faint)}
.row:hover{background:var(--hover)} .row.sel{background:var(--selected);color:var(--ink)}
.row.sub{padding-left:28px}
.row .chev{width:12px;height:12px;margin-left:-2px;transition:transform .15s}
.row.closed .chev{transform:rotate(-90deg)}
.sect{display:flex;align-items:center;height:30px;padding:0 4px 0 8px;margin-top:12px;font-size:12px;font-weight:600;color:var(--soft)}
.sect .ib{width:24px;height:24px;margin-left:auto;opacity:0}
.sect:hover .ib,.sect .ib:focus-visible{opacity:1}
.tree{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:1px}
.foot{display:flex;flex-direction:column;gap:1px;padding-top:6px}

/* Sheet */
.sheet{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--sheet);box-shadow:var(--shadow-note);position:relative}
.app.noside .sheet{box-shadow:none}
.head{height:46px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 16px}
.head .lights{margin-right:10px;display:none}
.app.noside .head .lights{display:flex}
.head .opener{display:none}
.app.noside .head .opener{display:grid}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--faint)}
.tabs{display:flex;gap:4px;min-width:0;overflow:hidden}
.tab{height:28px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-radius:8px;border:0;background:none;color:var(--soft);font-size:13px;cursor:default;max-width:180px}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--selected);color:var(--ink)}
.tab .x{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;opacity:0}
.tab:hover .x,.tab.on .x{opacity:.7}
.tab .x:hover{background:var(--hover);opacity:1}
.tab .x svg{width:12px;height:12px}
.spacer{flex:1}
.saved{font-size:12px;color:var(--faint);margin-right:6px;white-space:nowrap}

.body{flex:1;display:flex;min-height:0;position:relative}
.scroll{flex:1;overflow:auto;min-width:0}
.doc{max-width:calc(var(--measure) + 96px);margin:0 auto;padding:22px 48px 160px;font-size:calc(15px*var(--s));line-height:calc(22px*var(--s));color:var(--ink);font-feature-settings:"cv11","ss01"}
.app.nomotion *{transition:none!important;animation:none!important}

/* Blocks */
.b{position:relative;padding-top:calc(9px*var(--s));cursor:text;border-radius:4px}
.b:first-child{padding-top:0}
.mk{display:none;color:var(--faint);font-weight:400}
.reveal .live .mk{display:inline}
.reveal .live{background:linear-gradient(90deg,transparent,transparent)}
.caret{display:none}
.h{font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.h1{font-size:calc(28px*var(--s));line-height:1.3;font-weight:700}
.h2{font-size:calc(21px*var(--s));line-height:1.3;font-weight:700}
.h3{font-size:calc(18px*var(--s));line-height:1.33}
.h4{font-size:calc(16px*var(--s));line-height:1.4}
.h5,.h6{font-size:calc(15px*var(--s))} .h6{color:var(--soft)}
.b.k-h{padding-top:calc(22px*var(--s))} .b.k-h.n1{padding-top:calc(6px*var(--s))}
.b.k-h.n3,.b.k-h.n4{padding-top:calc(16px*var(--s))}
.b:first-child.k-h{padding-top:0}
p{margin:0}
strong{font-weight:600} del{color:var(--soft)}
a.ln{color:var(--link);text-decoration:none;cursor:pointer}
a.ln:hover{text-decoration:underline;text-underline-offset:3px}
code.ic{font:calc(13px*var(--s))/1 var(--mono);background:var(--chip);border:1px solid var(--chip-line);border-radius:4px;padding:1px 4px}
.reveal .live code.ic{background:none;border-color:transparent;padding:0}
.li{display:flex;align-items:flex-start;padding-left:calc(var(--d)*24px)}
.lead{width:24px;flex:none;height:calc(22px*var(--s));display:flex;align-items:center;justify-content:flex-start;padding-left:4px;color:var(--ink)}
.lead .dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.lead .dot.d1{background:none;box-shadow:inset 0 0 0 1px currentColor}
.lead .dot.d2{border-radius:1px;width:5px;height:5px}
.lead .num{font-variant-numeric:tabular-nums;color:var(--ink)}
.li .tx{flex:1;min-width:0}
.reveal .live .lead .dot,.reveal .live .lead .num,.reveal .live .lead .box{display:none}
.reveal .live .lead{width:auto;padding-left:0;padding-right:4px}
.box{width:17px;height:17px;border-radius:5px;border:1px solid var(--box);background:var(--sheet);display:grid;place-items:center;padding:0;cursor:pointer;color:#fff}
.box:hover{border-color:var(--accent)}
.box svg{width:13px;height:13px;opacity:0}
.box.on{background:var(--accent);border-color:var(--accent)} .box.on svg{opacity:1}
.k-task .lead{padding-left:0}
.done{color:var(--soft);text-decoration:line-through;text-decoration-color:var(--faint)}
.q{border-left:3px solid var(--quote);padding-left:14px;color:var(--ink)}
.reveal .live .q{border-left-color:transparent;padding-left:0}
.alert{border-radius:8px;padding:10px 14px;background:color-mix(in srgb,var(--tint) 7%,var(--sheet));border:1px solid color-mix(in srgb,var(--tint) 22%,var(--sheet))}
.alert .al{display:flex;align-items:center;gap:7px;color:var(--tint);font-weight:600;font-size:calc(14px*var(--s))}
.alert .al svg{width:16px;height:16px}
.reveal .live .alert .al svg,.reveal .live .alert .al .lbl{display:none}
.a-NOTE{--tint:var(--n)}.a-TIP{--tint:var(--tip)}.a-IMPORTANT{--tint:var(--imp)}.a-WARNING{--tint:var(--warn)}.a-CAUTION{--tint:var(--cau)}
.code{border:1px solid var(--code-line);background:var(--code-bg);border-radius:8px;overflow:hidden;font:calc(13px*var(--s))/calc(20px*var(--s)) var(--mono);position:relative}
.code .ch{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0 12px;height:26px;font:11px/1 var(--sans);color:var(--faint);letter-spacing:.02em}
.code .copy{opacity:0;width:24px;height:24px}
.code:hover .copy,.copy:focus-visible{opacity:1}
.code .cb{display:grid;grid-template-columns:auto minmax(0,1fr)}
.nums{padding:4px 10px 10px 12px;text-align:right;color:var(--gutter-num);background:var(--gutter);border-right:1px solid var(--code-line);user-select:none;font-variant-numeric:tabular-nums}
.app.nonums .nums{display:none}
.app.nonums .code .cb{grid-template-columns:minmax(0,1fr)}
.src{padding:4px 14px 10px;white-space:pre;overflow-x:auto;color:var(--ink)}
.fence{display:none;padding:0 14px;color:var(--faint)}
.reveal .live .fence{display:block}
.reveal .live .ch{display:none}
.t-com{color:var(--s-com);font-style:italic}.t-kw{color:var(--s-kw)}.t-str{color:var(--s-str)}.t-num{color:var(--s-num)}.t-type{color:var(--s-type)}.t-fn{color:var(--s-fn)}
.tblw{overflow-x:auto;border:1px solid var(--tline);border-radius:8px}
table{border-collapse:collapse;font-size:calc(14px*var(--s));line-height:calc(20px*var(--s));min-width:100%}
th,td{padding:9px 12px;border-right:1px solid var(--tline);border-bottom:1px solid var(--tline);text-align:left;white-space:nowrap}
th:last-child,td:last-child{border-right:0} tr:last-child td{border-bottom:0}
th{background:var(--th);font-weight:600}
.r{text-align:right}.c{text-align:center}
.hr{height:22px;display:flex;align-items:center}
.hr i{display:block;height:2px;width:100%;background-image:radial-gradient(circle,var(--dots) .8px,transparent 1.1px);background-size:6px 2px}
.reveal .live .hr i{display:none}
.math{text-align:center;font:italic calc(18px*var(--s))/1.6 "Cambria","Georgia",serif;padding:6px 0}
.reveal .live .math{text-align:left;font:calc(13px*var(--s))/calc(20px*var(--s)) var(--mono);font-style:normal}
.img{border:1px solid var(--line);border-radius:8px;height:120px;display:grid;place-items:center;color:var(--faint);font-size:13px;background:var(--chip)}
.ph{color:var(--faint);padding-top:calc(9px*var(--s));cursor:text}
.ph kbd{font:12px var(--mono);background:var(--chip);border:1px solid var(--chip-line);border-radius:4px;padding:0 4px;color:var(--soft)}
.viewing{display:flex;align-items:center;gap:10px;margin:0 auto 14px;max-width:calc(var(--measure));padding:8px 8px 8px 14px;border-radius:10px;background:var(--chip);font-size:13px;color:var(--soft)}
.viewing b{color:var(--ink);font-weight:500}
.btn{height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* Dock */
.dock{width:232px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:auto;background:var(--sheet)}
.app:not(.dockopen) .dock{display:none}
.dh{display:flex;align-items:center;height:28px;padding:0 6px;font-size:12px;font-weight:600;color:var(--soft);gap:4px;border:0;background:none;width:100%;cursor:pointer;border-radius:6px}
.dh:hover{background:var(--hover)}
.dh svg{width:12px;height:12px;transition:transform .15s}
.dh.closed svg{transform:rotate(-90deg)}
.ol{height:28px;display:flex;align-items:center;padding:0 8px;border-radius:6px;color:var(--soft);font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:none;width:100%;text-align:left}
.ol:hover{background:var(--hover);color:var(--ink)}
.ol.on{color:var(--ink);font-weight:500}
.ask{margin:6px 4px 0;display:flex;flex-direction:column;gap:6px}
.ask .sugg{font-size:12px;color:var(--soft);padding:4px 6px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left}
.ask .sugg:hover{background:var(--hover);color:var(--ink)}
.field{width:100%;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--ground);padding:0 10px;font:13px var(--sans);color:var(--ink)}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px}
.dsep{height:1px;background:var(--line);margin:8px 4px}

/* Drawer */
.drawer{position:absolute;right:0;top:0;bottom:0;width:300px;background:var(--sheet);border-left:1px solid var(--line);box-shadow:var(--shadow-menu);display:flex;flex-direction:column;z-index:4}
.drawer h3{margin:0;font-size:13px;font-weight:600;padding:14px 14px 8px;display:flex;align-items:center}
.drawer h3 .ib{margin-left:auto;width:26px;height:26px}
.vrow{margin:0 8px;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:2px;border:0;background:none;text-align:left;width:calc(100% - 16px)}
.vrow:hover{background:var(--hover)} .vrow.on{background:var(--selected)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:2px 5px 4px}
.gi{height:38px;border-radius:8px;border:0;background:none;display:grid;place-items:center;color:var(--icon);cursor:default;font:600 12px var(--sans)}
.gi svg{width:18px;height:18px}
.gi:hover,.gi.act{background:var(--hover)}
.slash{width:260px;max-height:360px;overflow:auto}
.slash .q0{padding:4px 13px 6px;font:12px var(--mono);color:var(--faint)}
.mi .tok{margin-left:auto;font:12px var(--mono);color:var(--faint)}

function drawPal(){
  const raw=$("#palq").value,list=$("#pall");
  if(raw.startsWith(">")){const q=raw.slice(1).trim().toLowerCase();pal.items=CMDS().filter(c=>c.t.toLowerCase().includes(q)).map(c=>({...c,cmd:true}))}
  else{const q=raw.trim().toLowerCase();const ids=Object.keys(NOTES).filter(k=>!S.trash.includes(k));
    const order=[...S.tabs,...ids.filter(k=>!S.tabs.includes(k))];
    pal.items=order.filter(k=>!q||NOTES[k].title.toLowerCase().includes(q)||NOTES[k].md.toLowerCase().includes(q)).map(k=>({id:k,q}));
    if(q)pal.items.push(...CMDS().filter(c=>c.t.toLowerCase().includes(q)).slice(0,3).map(c=>({...c,cmd:true})));}
  if(pal.act>=pal.items.length)pal.act=Math.max(0,pal.items.length-1);
  list.innerHTML=(!raw?`<div class="mlabel">Recent</div>`:"")+pal.items.map((it,k)=>it.cmd
    ?`<div class="pr${k===pal.act?" act":""}" role="option" data-k="${k}"><div class="t">${ic(it.i)}<span>${esc(it.t)}</span>${it.k?`<kbd>${it.k}</kbd>`:""}</div></div>`
    :`<div class="pr${k===pal.act?" act":""}" role="option" data-k="${k}"><div class="t">${ic("note")}<span>${esc(NOTES[it.id].title)}</span><kbd>${esc(NOTES[it.id].folder||"Notes")}</kbd></div>${it.q?`<div class="sn">${snippet(NOTES[it.id].md,it.q)}</div>`:""}</div>`).join("")
    +(pal.items.length?"":`<div class="mlabel" style="padding:12px 15px">Nothing matches. Press ↵ to create a note called “${esc(raw)}”</div>`);
  list.onclick=e=>{const r=e.target.closest(".pr");if(r)runPal(+r.dataset.k,e.metaKey||e.ctrlKey)};
  list.querySelector(".act")?.scrollIntoView({block:"nearest"});
}
function runPal(k,newTab){
  const it=pal?.items[k],raw=$("#palq")?.value||"";closePops();pal=null;
  if(!it){if(raw.trim()&&!raw.startsWith(">"))newNote(raw.trim());return}
  it.cmd?it.run():open(it.id,newTab);
}
function newNote(title){
  const k="n"+Date.now(),t=typeof title==="string"?title:"Untitled";NOTES[k]={title:t,folder:"",md:"# "+t+"\n"};open(k);setLive(0);toast("New note in ~/Documents/Notes");
}
function toggleSide(){
  if(app.getBoundingClientRect().width<=720){app.classList.toggle("sideover");app.classList.remove("noside")}
  else app.classList.toggle("noside");
}
function toggleDock(){app.classList.toggle("dockopen");renderHead();syncOutline()}
function setMode(m){S.mode=m;applyPrefs();if(S.view==="settings")renderMain()}
function syncOutline(){
  const sc=$("#scroll"),hs=[...document.querySelectorAll(".b.k-h")];if(!hs.length)return;
  const top=sc.getBoundingClientRect().top+24;let cur=hs[0];hs.forEach(h=>{if(h.getBoundingClientRect().top<=top)cur=h});
  document.querySelectorAll(".ol").forEach(o=>o.classList.toggle("on",o.dataset.go===cur.dataset.i));
}

/* Selection toolbar */
function showBar(){
  document.querySelector(".fbar")?.remove();
  const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed)return;
  const doc=$("#doc");if(!doc||!doc.contains(sel.anchorNode))return;
  const r=sel.getRangeAt(0).getBoundingClientRect();if(!r.width)return;
  const b=document.createElement("div");b.className="fbar";b.setAttribute("role","toolbar");b.setAttribute("aria-label","Format");
  const B=[["Text ▾","Turn into heading, list or quote",null],["bold","Bold: wraps the selection in **",MOD+"B"],["italic","Italic: wraps the selection in *",MOD+"I"],["strike","Strikethrough: wraps the selection in ~~",MOD+"⇧X"],["code","Inline code: wraps the selection in `",MOD+"E"],["link","Link: makes [selection](url)",MOD+"K"]];
  b.innerHTML=B.map(([n,t,k],j)=>(j===1?`<span class="sep"></span>`:"")+`<button data-fb="${j}" title="${t}${k?"  "+k:""}" aria-label="${t}">${ICON[n]?ic(n):`<span style="padding:0 4px;font-weight:500">${n}</span>`}</button>`).join("");
  document.body.append(b);
  b.style.left=Math.max(8,Math.min(innerWidth-b.offsetWidth-8,r.left+r.width/2-b.offsetWidth/2))+"px";
  b.style.top=Math.max(8,r.top-b.offsetHeight-8)+"px";
  b.onmousedown=e=>e.preventDefault();
  b.onclick=e=>{const k=e.target.closest("[data-fb]");if(k){toast(B[k.dataset.fb][1]);b.remove()}};
}

/* Events */
document.addEventListener("click",e=>{
  const t=e.target;
  if(!t.closest(".pop")&&!t.closest(".fbar")&&!t.closest("[data-act=more]")&&!t.closest(".ph")){document.querySelectorAll(".pop:not(.pal),.scrim:not(:has(+ .pal))").forEach(x=>x.remove());slash=null}
  const a=t.closest("[data-act]");
  if(a){const v=a.dataset.act;
    if(v==="side")toggleSide();else if(v==="dock")toggleDock();else if(v==="pal")openPal();else if(v==="new")newNote();
    else if(v==="settings"){S.view="settings";render()}else if(v==="back"){S.view="note";render()}
    else if(v==="more")moreMenu(a);else if(v==="ver"){S.ver=!S.ver;if(!S.ver)S.verSel=null;renderHead();renderMain()}
    else if(v==="vback"){S.verSel=null;renderMain()}else if(v==="restore"){toast(`Restored the version from ${VERSIONS[S.verSel].t}`);S.verSel=null;renderMain()}
    else if(v==="slash"){openSlash()}else if(v==="olfold"){S.olClosed=!S.olClosed;renderDock()}else if(v==="asst"){S.asst=!S.asst;renderDock()}
    else if(v==="asktoast")toast("The assistant proposes changes you accept or reject");
    else if(v==="themes"){S.view="note";render();openPal(">Theme")}
    else if(v==="folder")toast("Opens a folder picker");else if(v==="guide")a.closest(".guide").remove();
    else if(v==="trashinfo")toast("Trash keeps notes in .trash inside your notes folder");
    return;}
  const o=t.closest("[data-open]");if(o){open(o.dataset.open,e.metaKey||e.ctrlKey);return}
  const f=t.closest("[data-fold]");if(f){S.closed[f.dataset.fold]=!S.closed[f.dataset.fold];renderSide();return}
  const pg=t.closest("[data-page]");if(pg){S.page=pg.dataset.page;render();return}
  const cl=t.closest("[data-close]");if(cl){const id=cl.dataset.close;S.tabs=S.tabs.filter(x=>x!==id);if(S.active===id)S.active=S.tabs[S.tabs.length-1];render();return}
  const tb=t.closest("[data-tab]");if(tb){open(tb.dataset.tab);return}
  const st=t.closest("[data-set]");if(st){const k=st.dataset.set,v=st.dataset.v;if(k==="mode")S.mode=v.toLowerCase();if(k==="size")S.size=+v;if(k==="width")S.width=v;applyPrefs();renderMain();return}
  const sw=t.closest("[data-toggle]");if(sw){const k=sw.dataset.toggle;if(k in S)S[k]=!S[k];else{sw.classList.toggle("on")}applyPrefs();renderMain();return}
  const bx=t.closest(".box");if(bx){const L=note().md.split("\n"),at=+bx.dataset.at;L[at]=L[at].replace(/\[( |x|X)\]/,m=>m==="[ ]"?"[x]":"[ ]");note().md=L.join("\n");const keep=S.live;renderMain();setLive(keep);return}
  const cp=t.closest("[data-copy]");if(cp){copy(blocks[cp.dataset.copy].body.join("\n"),"Copied the code");return}
  const ln=t.closest("a.ln");if(ln&&!(S.reveal&&t.closest(".b.live"))){e.preventDefault();const h=ln.dataset.href;const id=Object.keys(NOTES).find(k=>k===h||NOTES[k].title.toLowerCase()===h);if(id){open(id);return}toast("Opens "+h+" in your browser");return}
  const go=t.closest("[data-go]");if(go){const el=document.querySelector(`.b[data-i="${go.dataset.go}"]`);el&&el.scrollIntoView({behavior:S.motion?"smooth":"auto",block:"start"});return}
  const vr=t.closest("[data-ver]");if(vr){S.verSel=+vr.dataset.ver;renderMain();return}
  const b=t.closest(".b");if(b&&!getSelection().toString())setLive(+b.dataset.i);
  else if(!b&&t.closest(".doc")===null&&t.closest(".scroll"))setLive(null);
});
document.addEventListener("contextmenu",e=>{const r=e.target.closest("[data-ctx]");if(r){e.preventDefault();rowMenu(r.dataset.ctx,e.clientX,e.clientY)}});
document.addEventListener("mouseup",()=>setTimeout(showBar,0));
document.addEventListener("keyup",e=>{if(e.shiftKey)showBar()});
document.addEventListener("selectionchange",()=>{if(getSelection().isCollapsed)document.querySelector(".fbar")?.remove()});
$("#scroll").addEventListener("scroll",()=>{syncOutline();document.querySelector(".fbar")?.remove()},{passive:true});
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey,inField=/INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if(pal&&$("#palq")){
    if(e.key==="ArrowDown"){pal.act=Math.min(pal.act+1,pal.items.length-1);drawPal();e.preventDefault();return}
    if(e.key==="ArrowUp"){pal.act=Math.max(pal.act-1,0);drawPal();e.preventDefault();return}
    if(e.key==="Enter"){runPal(pal.act,mod);e.preventDefault();return}
    if(e.key==="Escape"){closePops();pal=null;return}
  }
  if(slash&&document.querySelector(".slash")){
    if(e.key==="Escape"){slash=null;closePops();return}
    if(e.key==="ArrowDown"||e.key==="ArrowRight"){slash.act=Math.min(slash.act+1,slash.items.length-1);drawSlash();e.preventDefault();return}
    if(e.key==="ArrowUp"||e.key==="ArrowLeft"){slash.act=Math.max(slash.act-1,0);drawSlash();e.preventDefault();return}
    if(e.key==="Enter"){if(slash.items[slash.act])insert(slash.items[slash.act]);e.preventDefault();return}
    if(e.key==="Backspace"){if(!slash.q){slash=null;closePops()}else{slash.q=slash.q.slice(0,-1);drawSlash()}e.preventDefault();return}
    if(e.key.length===1&&!mod){slash.q+=e.key;drawSlash();e.preventDefault();return}
  }
  if(mod&&(e.key==="k"||e.key==="p")){e.preventDefault();openPal();return}
  if(mod&&e.key===","){e.preventDefault();S.view="settings";render();return}
  if(mod&&e.key==="\\"){e.preventDefault();toggleSide();return}
  if(mod&&e.shiftKey&&(e.key==="o"||e.key==="O")){e.preventDefault();toggleDock();return}
  if(mod&&e.key==="n"){e.preventDefault();newNote();return}
  if(e.key==="Escape"){closePops();setLive(null);return}
  if(!inField&&e.key==="/"&&S.view==="note"){e.preventDefault();openSlash();return}
  if(!inField&&S.view==="note"&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&S.live!=null){e.preventDefault();setLive(Math.max(0,Math.min(blocks.length-1,S.live+(e.key==="ArrowDown"?1:-1))));document.querySelector(".b.live")?.scrollIntoView({block:"nearest"})}
});
let wide=null;
addEventListener("resize",()=>{document.querySelector(".fbar")?.remove();const w=app.getBoundingClientRect().width>=1000;if(w!==wide){wide=w;app.classList.toggle("dockopen",w);if(S.view==="note")renderHead()}});

render();
if(app.getBoundingClientRect().width<1000)app.classList.remove("dockopen"),renderHead();
setLive(1);
const g=document.createElement("div");g.className="guide";
g.innerHTML=`<b>Try it</b><ul><li>Click any line to show its Markdown</li><li>Select text for the format bar</li><li>Press <kbd>/</kbd> to add a block</li><li><kbd>${MOD.trim()} K</kbd> to search, <kbd>&gt;</kbd> for commands</li><li>Right-click a note in the sidebar</li><li>Settings, bottom left: theme, size, width</li></ul><button class="ib" data-act="guide" aria-label="Close">${ic("x")}</button>`;
app.append(g);
</script>
