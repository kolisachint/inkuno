[book]
title = "Inkuno user guide"
description = "How to use Inkuno, a fast, minimal note-taking app for plain Markdown files."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/kolisachint/inkuno"
edit-url-template = "https://github.com/kolisachint/inkuno/edit/main/docs/user/{path}"
site-url = "/inkuno/guide/"
no-section-label = true

[output.html.fold]
enable = true
level = 1
