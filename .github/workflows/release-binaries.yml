# Reusable packaging jobs for macOS and Linux. They never attach to or publish a release.
name: Binaries
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or branch to build (artifacts only)
        type: string
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag }}
defaults:
  run:
    shell: bash
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # sccache with the GitHub Actions cache backend (see the setup step).
      # The two --target builds below hash as separate entries, so the Intel
      # and Apple Silicon objects never poison each other.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Retry fast-path: restore the universal binary uploaded by an earlier
      # attempt of this run when inputs are unchanged. The artifact name keys
      # on Cargo.lock + the pinned toolchain file + the Apple target pair
      # (aarch64-apple-darwin, x86_64-apple-darwin). A miss fails only this
      # step (continue-on-error) and the build below runs the full double
      # compile unchanged. Test/package steps always run. (Gate crew: this
      # step sits before build; keep build -> test -> package order.)
      - name: Restore cached universal binary (retry fast-path)
        id: build-cache
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: inkuno-build-binaries-macos-universal-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          path: .build-cache
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build one binary for Apple Silicon and Intel
        if: steps.build-cache.outcome == 'failure'
        run: |
          cargo build --release --locked -p inkuno --target aarch64-apple-darwin
          cargo build --release --locked -p inkuno --target x86_64-apple-darwin
          lipo -create -output inkuno-universal \
            target/aarch64-apple-darwin/release/inkuno target/x86_64-apple-darwin/release/inkuno
          lipo -info inkuno-universal
      - name: Place cached universal binary (retry fast-path)
        if: steps.build-cache.outcome == 'success'
        run: |
          cp .build-cache/inkuno-universal inkuno-universal
          lipo -info inkuno-universal
      # Saved right after build (before test/package) so a retry after a
      # later-step failure reuses the binary instead of recompiling.
      - name: Save universal binary for retries (retry fast-path)
        uses: actions/upload-artifact@v4
        with:
          name: inkuno-build-binaries-macos-universal-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          path: inkuno-universal
          retention-days: 7
          overwrite: true
          if-no-files-found: error
      - run: cargo test --locked
      - name: Package
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/inkuno/Cargo.toml | head -1)
          scripts/bundle-macos.sh inkuno-universal "$ver" dist/inkuno-macos.dmg
      - name: The disk image holds a valid Inkuno.app
        run: |
          hdiutil attach dist/inkuno-macos.dmg -mountpoint /Volumes/Inkuno -nobrowse -quiet
          codesign --verify --strict /Volumes/Inkuno/Inkuno.app
          lipo -archs /Volumes/Inkuno/Inkuno.app/Contents/MacOS/inkuno
          hdiutil detach /Volumes/Inkuno -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # sccache with the GitHub Actions cache backend (see the setup step).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # Retry fast-path: restore the Linux binary uploaded by an earlier
      # attempt of this run when inputs are unchanged. The artifact name keys
      # on Cargo.lock + the pinned toolchain file + x86_64-unknown-linux-gnu.
      # A miss fails only this step (continue-on-error) and the build below
      # runs the full compile unchanged. Test/package steps always run.
      # (Gate crew: this step sits before build; keep build -> test -> package
      # order.)
      - name: Restore cached Linux binary (retry fast-path)
        id: build-cache
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: inkuno-build-binaries-linux-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          path: .build-cache
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            pkg-config \
            clang
      - run: rustup toolchain install stable --profile minimal
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - if: steps.build-cache.outcome == 'failure'
        run: cargo build --release --locked -p inkuno
      - name: Place cached binary when restored (retry fast-path)
        if: steps.build-cache.outcome == 'success'
        run: |
          set -euo pipefail
          app=$(sed -n 's/^name = "\(.*\)"/\1/p' crates/inkuno/Cargo.toml | head -1)
          mkdir -p target/release
          cp ".build-cache/$app" "target/release/$app"
          ls -la "target/release/$app"
      # Staged under the manifest-derived name (rename-crew safe), then saved
      # right after build (before test/package) so a retry after a later-step
      # failure reuses the binary instead of recompiling.
      - name: Stage binary for the retry cache (retry fast-path)
        run: |
          set -euo pipefail
          app=$(sed -n 's/^name = "\(.*\)"/\1/p' crates/inkuno/Cargo.toml | head -1)
          mkdir -p .build-cache-save
          cp "target/release/$app" ".build-cache-save/$app"
      - name: Save Linux binary for retries (retry fast-path)
        uses: actions/upload-artifact@v4
        with:
          name: inkuno-build-binaries-linux-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          path: .build-cache-save/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
          # The staging folder is dot-prefixed, which upload-artifact skips by default.
          include-hidden-files: true
      - name: Package Linux archive
        run: |
          set -euo pipefail
          # Follows crates/inkuno/Cargo.toml so the rename needs no edit here; the rename
          # crew owns the remaining hardcoded `bref` strings in this file.
          app=$(sed -n 's/^name = "\(.*\)"/\1/p' crates/inkuno/Cargo.toml | head -1)
          mkdir -p dist
          cp "target/release/$app" "dist/$app"
          tar -C dist -czf "dist/$app-linux-x86_64.tar.gz" "$app"
          rm "dist/$app"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
