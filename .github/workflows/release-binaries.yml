# Reusable packaging jobs for macOS and Linux. They never attach to or publish a release.
name: Binaries
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or branch to build (artifacts only)
        type: string
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag }}
defaults:
  run:
    shell: bash
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Build one binary for Apple Silicon and Intel
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output bref-universal \
            target/aarch64-apple-darwin/release/bref target/x86_64-apple-darwin/release/bref
          lipo -info bref-universal
      - run: cargo test --locked
      - name: Package
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          scripts/bundle-macos.sh bref-universal "$ver" dist/bref-macos.dmg
      - name: The disk image holds a valid Bref.app
        run: |
          hdiutil attach dist/bref-macos.dmg -mountpoint /Volumes/Bref -nobrowse -quiet
          codesign --verify --strict /Volumes/Bref/Bref.app
          lipo -archs /Volumes/Bref/Bref.app/Contents/MacOS/bref
          hdiutil detach /Volumes/Bref -quiet
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: dist/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            pkg-config \
            clang
      - run: rustup toolchain install stable --profile minimal
      - run: cargo build --release --locked
      - name: Package Linux archive
        run: |
          set -euo pipefail
          # Follows Cargo.toml so the rename needs no edit here; the rename
          # crew owns the remaining hardcoded `bref` strings in this file.
          app=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          cp "target/release/$app" "dist/$app"
          tar -C dist -czf "dist/$app-linux-x86_64.tar.gz" "$app"
          rm "dist/$app"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/*
          retention-days: 7
          overwrite: true
          if-no-files-found: error
