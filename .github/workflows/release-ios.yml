# Signed iOS IPA for the owner's own iPhone: ad-hoc export (`release-testing`).
#
# Output is a workflow artifact only (inkuno-ios-ipa). It never attaches to or
# publishes a GitHub release: scripts/publish-release.py accepts macOS + Linux
# assets and nothing else.
#
# Not wired into release-native.yml yet. To wire it later, add a job there:
#   ios:
#     uses: ./.github/workflows/release-ios.yml
#     with:
#       tag: ${{ inputs.tag }}
#     secrets: inherit
# and leave it out of the `publish` job's needs until publish-release.py is
# taught about iOS assets.
#
# Secrets live in the `ios-device` environment (IOS_CERT_P12_BASE64,
# IOS_CERT_PASSWORD, IOS_PROFILE_BASE64). APPLE_TEAM_ID is a repository
# variable. docs/releasing.md explains how to create them.
name: iOS release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build (vX.Y.Z); empty builds the selected ref
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: Version tag to build (vX.Y.Z); empty builds the calling ref
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: ios-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag syntax before checkout
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like vX.Y.Z, got: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Check the tag matches crates/inkuno/Cargo.toml
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/inkuno/Cargo.toml | head -1)
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match crates/inkuno/Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MARKETING_VERSION will be $version"
  build:
    needs: validate
    runs-on: macos-26
    # Reads the environment secrets. Add required reviewers to the environment
    # in the repository settings to approve each signed build.
    environment: ios-device
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_VERSION: ${{ needs.validate.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # sccache with the GitHub Actions cache backend, as in release-binaries.yml.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Check the signing inputs are present
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in CERT_P12_BASE64 CERT_PASSWORD PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::secret for $name is empty; set IOS_* in the ios-device environment"
              exit 1
            fi
          done
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::repository variable APPLE_TEAM_ID is not set"
            exit 1
          fi
      - name: Select Xcode
        run: |
          set -euo pipefail
          dev=/Applications/Xcode.app/Contents/Developer
          if [ ! -d "$dev" ]; then
            # Fallback: the newest Xcode*.app on the image, whatever its name.
            app=$(find /Applications -maxdepth 1 -name 'Xcode*.app' | sort -V | tail -1 || true)
            if [ -z "$app" ]; then
              echo "::error::no Xcode found under /Applications"
              exit 1
            fi
            dev="$app/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$dev" xcodebuild -version
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain
      - name: Add iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Enable sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: Swatinem/rust-cache@v2
      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Import the signing certificate and profile into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/inkuno-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          # Save the search list now; the cleanup step restores it.
          security list-keychains -d user | tr -d ' "' > "$RUNNER_TEMP/keychains-before.txt"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          xargs security list-keychains -d user -s "$keychain" < "$RUNNER_TEMP/keychains-before.txt"

          p12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/^ *[0-9]*) \([0-9A-F]\{40\}\) .*/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::the .p12 holds no valid code-signing identity"
            exit 1
          fi

          profile="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")
          if [ "$app_id" != "$APPLE_TEAM_ID.com.inkuno.Inkuno" ]; then
            echo "::error::profile app id is $app_id, expected $APPLE_TEAM_ID.com.inkuno.Inkuno"
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" >/dev/null 2>&1; then
            echo "::error::profile has no ProvisionedDevices; an ad-hoc profile is required"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          rm -f "$profile"

          # Passed to later steps and to cleanup; none of these values is a secret.
          {
            echo "KEYCHAIN=$keychain"
            echo "SIGN_IDENTITY=$identity"
            echo "PROFILE_NAME=$name"
            echo "PROFILE_UUID=$uuid"
          } >> "$GITHUB_ENV"
          echo "Signing identity $identity, ad-hoc profile \"$name\""
      - name: Build the Rust core for devices (release)
        run: scripts/build-ios-core.sh release
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Archive (manual signing, release configuration)
        env:
          # The build number is the CI run number; the version comes from Cargo.toml.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/Inkuno.xcodeproj -scheme Inkuno -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/Inkuno.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Export the ad-hoc IPA
        run: |
          set -euo pipefail
          # Written under ios/build, which is never committed.
          python3 - <<'PY'
          import os, plistlib

          options = {
              # Xcode 15+ name for ad-hoc distribution; `debugging` is the development one.
              "method": "release-testing",
              "signingStyle": "manual",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "stripSwiftSymbols": True,
              "provisioningProfiles": {"com.inkuno.Inkuno": os.environ["PROFILE_NAME"]},
          }
          with open("ios/build/ExportOptions-release-testing.plist", "wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive \
            -archivePath ios/build/Inkuno.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist ios/build/ExportOptions-release-testing.plist
          ls -la ios/build/export
      - name: The IPA is a valid archive with the expected app
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(ios/build/export/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "::error::expected exactly one IPA, found ${#ipas[@]}"
            exit 1
          fi
          unzip -tq "${ipas[0]}"
          unzip -l "${ipas[0]}" | grep -q 'Payload/Inkuno.app/Info.plist'
      - name: Upload the IPA as a workflow artifact (not a release asset)
        uses: actions/upload-artifact@v4
        with:
          name: inkuno-ios-ipa
          path: ios/build/export/*.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Remove the signing material
        if: always()
        run: |
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true
          fi
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          if [ -s "$RUNNER_TEMP/keychains-before.txt" ]; then
            xargs security list-keychains -d user -s < "$RUNNER_TEMP/keychains-before.txt" || true
          fi
          rm -f "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/signing.p12" || true
