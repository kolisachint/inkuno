name: release

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Tag builds get their own group; all branch/dispatch builds share one global
  # group so two branches cannot race on the single `nightly` release and tag.
  group: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'release-nightly' }}
  # Let a running build finish; only a queued (pending) run is replaced by a newer push.
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked

      - name: Package inkuno.app bundle and archives
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          VERSION=$(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)
          echo "Workspace version: ${VERSION}"

          rm -rf dist
          mkdir -p dist

          # Raw binary archive (tar.gz containing only `inkuno`).
          cp target/release/inkuno dist/inkuno
          tar -C dist -czf dist/inkuno-macos-arm64.tar.gz inkuno
          rm dist/inkuno

          # App bundle: the property list has a single source, packaging/macos/Info.plist.
          BUNDLE=dist/inkuno.app
          mkdir -p "${BUNDLE}/Contents/MacOS"
          cp target/release/inkuno "${BUNDLE}/Contents/MacOS/inkuno"
          sed "s/@VERSION@/${VERSION}/g" packaging/macos/Info.plist > "${BUNDLE}/Contents/Info.plist"
          plutil -lint "${BUNDLE}/Contents/Info.plist" >/dev/null

          # Ad-hoc signature (no Developer ID; not notarized).
          codesign --force --deep -s - "${BUNDLE}"
          codesign --verify --deep --strict "${BUNDLE}"

          # Zip the bundle with ditto so macOS metadata and symlinks survive.
          (cd dist && ditto -c -k --keepParent inkuno.app inkuno-macos-arm64.zip)

          ls -la dist

      - name: Upload macOS archives
        uses: actions/upload-artifact@v4
        with:
          name: inkuno-macos-arm64
          path: |
            dist/inkuno-macos-arm64.zip
            dist/inkuno-macos-arm64.tar.gz
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            pkg-config \
            clang

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Linux archive
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp target/release/inkuno dist/inkuno
          tar -C dist -czf dist/inkuno-linux-x86_64.tar.gz inkuno
          rm dist/inkuno
          ls -la dist

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: inkuno-linux-x86_64
          path: dist/inkuno-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List archives
        run: ls -la dist

      - name: Generate SHA256SUMS and release notes
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum inkuno-macos-arm64.zip inkuno-macos-arm64.tar.gz inkuno-linux-x86_64.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          {
            echo "Build: ${GITHUB_SHA}"
            echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "Verify downloads: \`shasum -a 256 -c SHA256SUMS\`"
            echo ""
            echo "The macOS build is unsigned and ad-hoc signed (not notarized by Apple)."
            echo "After unzipping inkuno-macos-arm64.zip, run the following before opening the app:"
            echo ""
            echo "    xattr -dr com.apple.quarantine inkuno.app"
            echo ""
            echo "inkuno-macos-arm64.tar.gz and inkuno-linux-x86_64.tar.gz each contain"
            echo "only the \`inkuno\` executable (Apple Silicon macOS and Linux x86_64)."
            echo ""
            echo "## Changes"
            echo ""
            if [ "${IS_TAG}" = "true" ]; then
              PREV_TAG="$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
              if [ -n "${PREV_TAG}" ]; then
                echo "Commits since ${PREV_TAG}:"
                echo ""
                git log --no-merges --pretty='- %s (%h)' "${PREV_TAG}..${GITHUB_REF_NAME}" | head -n 200
              else
                echo "Commits in this release:"
                echo ""
                git log --no-merges --pretty='- %s (%h)' "${GITHUB_REF_NAME}" | head -n 200
              fi
            else
              PREV_SHA="$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
              if [ -n "${PREV_SHA}" ] && git cat-file -e "${PREV_SHA}^{commit}" 2>/dev/null; then
                echo "Commits since previous nightly (${PREV_SHA}):"
                echo ""
                git log --no-merges --pretty='- %s (%h)' "${PREV_SHA}..HEAD" | head -n 200
              else
                echo "Recent commits:"
                echo ""
                git log --no-merges --pretty='- %s (%h)' -n 50
              fi
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Delete previous nightly release and tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: gh release delete nightly --cleanup-tag -y || true

      - name: Publish tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          body_path: release-notes.md
          files: |
            dist/inkuno-macos-arm64.zip
            dist/inkuno-macos-arm64.tar.gz
            dist/inkuno-linux-x86_64.tar.gz
            dist/SHA256SUMS

      - name: Publish nightly release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly (${{ github.sha }})"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            dist/inkuno-macos-arm64.zip
            dist/inkuno-macos-arm64.tar.gz
            dist/inkuno-linux-x86_64.tar.gz
            dist/SHA256SUMS
