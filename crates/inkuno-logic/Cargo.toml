[package]
name = "inkuno-logic"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "Pure logic of Inkuno: Markdown, notes, vault lists (no window, no disk)"
license = "MIT"

[dependencies]
# Same versions as the app's Cargo.lock: never re-resolve, keep --locked/--offline green.
regex = "=1.12.2"
unicode-width = "=0.2.2"

[dev-dependencies]
# Conformance oracle only (docs/design/markdown_renderer.md §11.3): the app never links it.
comrak = { version = "=1.1.0", default-features = false }
serde_json = "=1.0.145"
