[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
md_editor = { path = "../md_editor" }
workspace = { path = "../workspace" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }

# gpui_linux is built with default features off in zed's workspace, so without these
# the Linux platform has no windowing backend and runs headless. Match gpui_linux's defaults.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["x11", "wayland"] }

# Without font-kit, gpui_macos falls back to NoopTextSystem and renders no text at all.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }
