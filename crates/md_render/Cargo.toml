[package]
name = "md_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-highlight = "0.27.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
resvg = "0.46"
# S1 spike only (docs/spikes/S1-render-host.md). Optional; not used by the render queue.
rquickjs = { version = "0.14.0", optional = true }

[features]
spike-quickjs = ["dep:rquickjs"]
# resvg is now a regular dependency (task 6.4); feature kept so the S1 example's command still works.
spike-resvg = []
