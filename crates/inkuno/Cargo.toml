[package]
name = "inkuno"
version = "0.0.13"
edition = "2024"
rust-version = "1.98"
description = "Fast, minimal Markdown note-taking app"
license = "MIT"
repository = "https://github.com/kolisachint/inkuno"

[dependencies]
# Already pulled in by gpui, same version: the archive of the backup.
gpui = { package = "gpui-pre", version = "=0.3.14" }
# The windowing backends are features of the platform crate: without `x11` and `wayland` the Linux build
# has no display server and no text system (an app that never opens a window). `font-kit` is the macOS text system.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["wayland", "x11", "font-kit"] }
# The pure logic (Markdown, notes, vault lists): no gpui, no disk, no window.
inkuno-logic = { version = "0.0.1", path = "../inkuno-logic" }
# The outside world (vault, processes, OS) and the look (theme, fonts, figures): re-exported by
# `platform` and `ui`, so every `crate::platform::…` and `crate::ui::…` path keeps working.
inkuno-platform = { version = "0.0.1", path = "../inkuno-platform" }
inkuno-ui = { version = "0.0.1", path = "../inkuno-ui" }
# The system reports the changes of the vault (inotify, FSEvents…). Version 7 is kept as it is: GPUI
# (gpui-pre) no longer pins it, moving to 8 is a change of its own.
notify = "7"
# Already pulled in by gpui, same version: the regular expressions of the search.
regex = "1.12.2"
# serde_json is already pulled in by gpui, same version. resvg is 0.45 (gpui-pre pulls 0.46 as well):
# import and export of the diagrams.
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde_json = "1.0.145"
# Already pulled in by gpui, same version: the checksum of the update.
sha2 = "0.10.9"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# The read-only HTML prototype viewer (`inkuno view`): a native webview, no gpui. Not on Windows,
# where the command says the build has no viewer.
[target.'cfg(not(windows))'.dependencies]
inkuno-view = { version = "0.0.1", path = "../inkuno-view", optional = true }

[features]
default = ["viewer"]
# `inkuno view <file.html>`; off, the command only says the build has no viewer.
viewer = ["dep:inkuno-view"]

[dev-dependencies]
inkuno-platform = { version = "0.0.1", path = "../inkuno-platform", features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"] }
