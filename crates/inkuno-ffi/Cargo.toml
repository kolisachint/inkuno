[package]
name = "inkuno-ffi"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "UniFFI bridge: the editor slice of inkuno-logic, for the iOS app (no window, no gpui)"
license = "MIT"

[lib]
name = "inkuno_ffi"
crate-type = ["lib", "staticlib"]

# The bindings generator (`--features bindgen`). Not uniffi's `cli` feature: it pulls clap with its
# derive, whose syn needs a version the app's Cargo.lock does not have (see src/bin/uniffi-bindgen.rs).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/bindgen"]

[dependencies]
inkuno-logic = { version = "0.0.1", path = "../inkuno-logic" }
# Proc-macro mode: no build script, no UDL file. `default-features = false` drops `cargo-metadata`.
uniffi = { version = "=0.31.2", default-features = false }
