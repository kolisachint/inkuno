[workspace]
resolver = "2"
members = [
    "crates/md_core",
    "crates/md_render",
    "crates/md_editor",
    "crates/workspace",
    "crates/app",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
pulldown-cmark = "0.13"
# GPUI pinned to zed-industries/zed@c7bea343838f42b4c14151393e41f0bbe033c95e (2026-11-04). Bump deliberately, as its own change (DESIGN §10).
gpui = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }
# Platform entry point used by zed's own examples (gpui_platform::application()); same pin.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }
