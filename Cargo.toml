# Virtual workspace: every crate lives under crates/ (the app is crates/inkuno).
[workspace]
members = ["crates/*"]
resolver = "3"

# Profiles are read from the workspace root only.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true

# Faster dev builds: line tables only (no full debug info), and the dependencies (GPUI…) built
# optimized once, so the app runs at a usable speed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
